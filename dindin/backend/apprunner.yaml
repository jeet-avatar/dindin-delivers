# AWS App Runner Configuration for EatFair P2P Backend
# Deploy: aws apprunner create-service --cli-input-json file://apprunner-service.json

version: 1.0
runtime: python311

build:
  commands:
    build:
      - pip install -r requirements.txt

run:
  runtime-version: 3.11
  command: uvicorn main_new:app --host 0.0.0.0 --port 8080 --workers 4
  network:
    port: 8080
  env:
    - name: ENVIRONMENT
      value: "production"
    - name: PORT
      value: "8080"

# Auto-scaling configuration
# This scales from 1 to 25 instances automatically based on traffic
