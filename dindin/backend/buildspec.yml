# AWS CodeBuild Buildspec - Enterprise CI/CD Pipeline
version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPO_NAME: eatfair-backend
    APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:134607809447:service/eatfair-api/fc47ca8c63e548f9967428c272411f96

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build Phase ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME
      - export IMAGE_TAG=latest
      - echo "Repository URI is $REPOSITORY_URI"
      - echo "Image Tag is $IMAGE_TAG"

  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Building Docker image..."
      - echo "Current directory:"
      - pwd
      - ls -la
      - ls -la dindin/backend/
      - docker build -t $ECR_REPO_NAME:latest -f dindin/backend/Dockerfile dindin/backend/
      - docker tag $ECR_REPO_NAME:latest $REPOSITORY_URI:latest
      - echo "Docker image built successfully"

  post_build:
    commands:
      - echo "=== Post-Build Phase ==="
      - echo "Pushing Docker image to ECR..."
      - docker push $REPOSITORY_URI:latest
      - echo "Triggering App Runner deployment..."
      - aws apprunner start-deployment --service-arn $APP_RUNNER_SERVICE_ARN || echo "App Runner deployment triggered"
      - echo "=== Build Complete ==="
