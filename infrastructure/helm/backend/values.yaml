# Default values for dollor-backend
# This is a YAML-formatted file.

# Namespace
namespace: default

# Application name
name: dollor-backend

# Image configuration
image:
  repository: ""  # Set via values-{env}.yaml
  tag: "latest"
  pullPolicy: IfNotPresent

# Replicas (ignored when using Argo Rollouts)
replicas: 1

# Rollout strategy
rollout:
  enabled: true
  strategy: "canary"  # canary or blueGreen

  # Canary configuration
  canary:
    steps:
      - setWeight: 10
      - pause: { duration: 5m }
      - setWeight: 25
      - pause: { duration: 5m }
      - setWeight: 50
      - pause: { duration: 5m }
      - setWeight: 100

    # Analysis configuration
    analysis:
      enabled: true
      successCondition: "result[0] >= 0.99"
      failureLimit: 2
      interval: "1m"

  # Blue-Green configuration
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: 300
    scaleDownDelaySeconds: 1800
    previewReplicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Preview service (for blue-green)
previewService:
  enabled: false
  port: 80

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.dollor.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dollor-api-tls
      hosts:
        - api.dollor.ai

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Environment variables
env:
  - name: ENVIRONMENT
    value: "development"
  - name: LOG_LEVEL
    value: "INFO"

# Secrets (from External Secrets or Sealed Secrets)
envFrom: []

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Prometheus metrics
metrics:
  enabled: true
  port: 9090
  path: /metrics

# ConfigMap data
configMap:
  enabled: true
  data: {}
