# Production environment values
# Uses Blue-Green deployment with manual promotion

namespace: production
name: dollor-backend
image:
  repository: 123456789.dkr.ecr.us-east-1.amazonaws.com/dollor-api
  tag: "8c0a680aba1371507d008fe7274b2a558d734c1d"
  pullPolicy: Always
replicas: 3
# Production uses BLUE-GREEN deployment
rollout:
  enabled: true
  strategy: "blueGreen"
  blueGreen:
    # Disable auto-promotion - require manual approval
    autoPromotionEnabled: false
    # Auto-promote after 10 minutes of successful preview (optional)
    autoPromotionSeconds: 600
    # Keep old (blue) version for 30 minutes for instant rollback
    scaleDownDelaySeconds: 1800
    # Preview replica count
    previewReplicaCount: 2
    # Pre-promotion analysis
    prePromotionAnalysis:
      templates:
        - templateName: success-rate
        - templateName: latency-check
      args:
        - name: service-name
          value: dollor-backend-preview
    # Post-promotion analysis
    postPromotionAnalysis:
      templates:
        - templateName: success-rate
      args:
        - name: service-name
          value: dollor-backend
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
# Preview service for blue-green
previewService:
  enabled: true
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: api.dollor.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dollor-api-tls
      hosts:
        - api.dollor.ai
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
env:
  - name: ENVIRONMENT
    value: "production"
  - name: LOG_LEVEL
    value: "WARNING"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: dollor-secrets-production
        key: DATABASE_URL
  - name: SENTRY_DSN
    valueFrom:
      secretKeyRef:
        name: dollor-secrets-production
        key: SENTRY_DSN
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 2
# ConfigMap for production
configMap:
  enabled: true
  data:
    CORS_ORIGINS: "https://dollor.ai,https://www.dollor.ai"
    RATE_LIMIT: "100"
# Enable metrics for production
metrics:
  enabled: true
  port: 9090
  path: /metrics
# Node affinity for production
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dollor-backend
          topologyKey: kubernetes.io/hostname
