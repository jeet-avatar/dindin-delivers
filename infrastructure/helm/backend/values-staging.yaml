# Staging environment values
# Uses Canary deployment with analysis

namespace: staging
name: dollor-backend-staging
image:
  repository: 123456789.dkr.ecr.us-east-1.amazonaws.com/dollor-api
  tag: "847998d13773bdaa17ad1f01664b470ef2e96dd5"
  pullPolicy: Always
replicas: 2
# Staging uses CANARY deployment
rollout:
  enabled: true
  strategy: "canary"
  canary:
    steps:
      # Step 1: 10% traffic
      - setWeight: 10
      - pause: {duration: 3m}
      - analysis:
          templates:
            - templateName: success-rate
          args:
            - name: service-name
              value: dollor-backend-staging
      # Step 2: 30% traffic
      - setWeight: 30
      - pause: {duration: 3m}
      # Step 3: 50% traffic
      - setWeight: 50
      - pause: {duration: 5m}
      # Step 4: 80% traffic
      - setWeight: 80
      - pause: {duration: 5m}
      # Step 5: Full rollout (100%)
      - setWeight: 100
    # Traffic routing
    trafficRouting:
      nginx:
        stableIngress: dollor-backend-staging-stable
        annotationPrefix: nginx.ingress.kubernetes.io
    # Analysis configuration
    analysis:
      enabled: true
      successCondition: "result[0] >= 0.99"
      failureLimit: 2
      interval: "1m"
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: staging-api.dollor.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-dollor-api-tls
      hosts:
        - staging-api.dollor.ai
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
env:
  - name: ENVIRONMENT
    value: "staging"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: dollor-secrets-staging
        key: DATABASE_URL
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# ConfigMap for staging
configMap:
  enabled: true
  data:
    CORS_ORIGINS: "https://staging.dollor.ai"
    RATE_LIMIT: "500"
