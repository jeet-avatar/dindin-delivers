# Analysis Templates for Canary Deployment
---
# Success Rate Analysis
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: staging-success-rate
  namespace: staging
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      # Run every minute
      interval: 1m
      # Success rate must be >= 99%
      successCondition: result[0] >= 0.99
      # Fail after 3 consecutive failures
      failureLimit: 3
      # Inconclusive if no data
      inconclusiveLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status=~"2.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
---
# Latency Analysis (P99)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: staging-latency
  namespace: staging
spec:
  args:
    - name: service-name
  metrics:
    - name: latency-p99
      interval: 1m
      # P99 latency must be < 500ms (0.5 seconds)
      successCondition: result[0] < 0.5
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            histogram_quantile(0.99,
              sum(rate(
                http_request_duration_seconds_bucket{
                  service="{{args.service-name}}"
                }[5m]
              )) by (le)
            )
---
# Error Rate Analysis
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: staging-error-rate
  namespace: staging
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 1m
      # Error rate must be < 1%
      successCondition: result[0] < 0.01
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status=~"5.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
---
# Memory Usage Analysis
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: staging-memory
  namespace: staging
spec:
  args:
    - name: service-name
  metrics:
    - name: memory-usage
      interval: 2m
      # Memory usage must be < 80%
      successCondition: result[0] < 0.8
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            avg(
              container_memory_usage_bytes{
                pod=~"{{args.service-name}}.*",
                container!=""
              } /
              container_spec_memory_limit_bytes{
                pod=~"{{args.service-name}}.*",
                container!=""
              }
            )
