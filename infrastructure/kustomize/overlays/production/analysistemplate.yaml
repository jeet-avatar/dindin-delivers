# Production Analysis Templates for Blue-Green Deployment
---
# Success Rate Analysis (stricter for production)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prod-success-rate
  namespace: production
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      # Run every minute for 5 minutes
      interval: 1m
      count: 5
      # Success rate must be >= 99.5% for production
      successCondition: result[0] >= 0.995
      failureLimit: 1
      inconclusiveLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status=~"2.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
---
# Latency Analysis (P99 - stricter for production)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prod-latency
  namespace: production
spec:
  args:
    - name: service-name
  metrics:
    - name: latency-p99
      interval: 1m
      count: 5
      # P99 latency must be < 300ms for production
      successCondition: result[0] < 0.3
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            histogram_quantile(0.99,
              sum(rate(
                http_request_duration_seconds_bucket{
                  service="{{args.service-name}}"
                }[5m]
              )) by (le)
            )
    - name: latency-p95
      interval: 1m
      count: 5
      # P95 latency must be < 200ms
      successCondition: result[0] < 0.2
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            histogram_quantile(0.95,
              sum(rate(
                http_request_duration_seconds_bucket{
                  service="{{args.service-name}}"
                }[5m]
              )) by (le)
            )
---
# Error Rate Analysis (stricter for production)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prod-error-rate
  namespace: production
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate-5xx
      interval: 1m
      count: 5
      # 5xx error rate must be < 0.5% for production
      successCondition: result[0] < 0.005
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status=~"5.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
    - name: error-rate-4xx
      interval: 1m
      count: 5
      # 4xx error rate should be monitored (not critical)
      successCondition: result[0] < 0.1
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}",
                status=~"4.."
              }[5m]
            )) /
            sum(rate(
              http_requests_total{
                service="{{args.service-name}}"
              }[5m]
            ))
---
# Saturation Analysis (CPU/Memory)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prod-saturation
  namespace: production
spec:
  args:
    - name: service-name
  metrics:
    - name: cpu-usage
      interval: 2m
      count: 3
      # CPU usage must be < 70%
      successCondition: result[0] < 0.7
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            avg(
              rate(container_cpu_usage_seconds_total{
                pod=~"{{args.service-name}}.*",
                container!=""
              }[5m])
            ) /
            avg(
              kube_pod_container_resource_limits{
                pod=~"{{args.service-name}}.*",
                resource="cpu"
              }
            )
    - name: memory-usage
      interval: 2m
      count: 3
      # Memory usage must be < 75%
      successCondition: result[0] < 0.75
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            avg(
              container_memory_usage_bytes{
                pod=~"{{args.service-name}}.*",
                container!=""
              }
            ) /
            avg(
              kube_pod_container_resource_limits{
                pod=~"{{args.service-name}}.*",
                resource="memory"
              }
            )
