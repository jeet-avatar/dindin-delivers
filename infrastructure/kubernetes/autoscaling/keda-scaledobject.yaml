# ============================================
# KEDA (Kubernetes Event-Driven Autoscaling)
# Advanced autoscaling based on external metrics
# ============================================
---
# KEDA ScaledObject for Production
# Scales based on:
# - Prometheus metrics (request rate, queue depth)
# - AWS SQS queue length
# - Redis queue length
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dollor-backend-scaledobject
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: prod-dollor-backend
  pollingInterval: 15        # Check every 15 seconds
  cooldownPeriod: 300        # Wait 5 minutes before scaling down
  idleReplicaCount: 0        # Don't scale to 0 (keep min from HPA)
  minReplicaCount: 3
  maxReplicaCount: 100
  fallback:
    failureThreshold: 3
    replicas: 5              # Fallback to 5 replicas if metrics fail
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: dollor-backend-keda-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 10
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 200
              periodSeconds: 15
  triggers:
    # Trigger 1: Request rate from Prometheus
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: http_requests_per_second
        threshold: "100"
        query: |
          sum(rate(http_requests_total{service="prod-dollor-backend"}[2m]))

    # Trigger 2: Request latency (P95)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: http_latency_p95
        threshold: "0.3"  # Scale if P95 > 300ms
        query: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="prod-dollor-backend"}[2m])) by (le))

    # Trigger 3: Error rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: http_error_rate
        threshold: "0.01"  # Scale if error rate > 1%
        query: |
          sum(rate(http_requests_total{service="prod-dollor-backend",status=~"5.."}[2m])) / sum(rate(http_requests_total{service="prod-dollor-backend"}[2m]))

    # Trigger 4: CPU utilization
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"

    # Trigger 5: Memory utilization
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"
---
# KEDA ScaledObject for Staging (simpler config)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dollor-backend-scaledobject
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: staging-dollor-backend
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: http_requests_per_second
        threshold: "50"
        query: |
          sum(rate(http_requests_total{service="staging-dollor-backend"}[2m]))
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
