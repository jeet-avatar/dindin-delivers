# Dollor.ai API Gateway Configuration (NGINX)
# =============================================
# Routes requests to appropriate microservices
#
# Deployment: Use as ConfigMap in Kubernetes
# Alternative: Kong API Gateway for more features

upstream p2p-backend {
    server p2p-backend:8080;
    keepalive 32;
}

upstream auth-service {
    server auth-service:8001;
    keepalive 16;
}

upstream user-service {
    server user-service:8002;
    keepalive 16;
}

upstream driver-service {
    server driver-service:8003;
    keepalive 16;
}

upstream restaurant-service {
    server restaurant-service:8004;
    keepalive 16;
}

upstream order-service {
    server order-service:8005;
    keepalive 16;
}

upstream payment-service {
    server payment-service:8006;
    keepalive 16;
}

upstream location-service {
    server location-service:8007;
    keepalive 16;
}

upstream menu-service {
    server menu-service:8008;
    keepalive 16;
}

upstream notification-service {
    server notification-service:8009;
    keepalive 16;
}

upstream rating-service {
    server rating-service:8013;
    keepalive 16;
}

upstream ride-service {
    server ride-service:8014;
    keepalive 16;
}

upstream pricing-service {
    server pricing-service:8015;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

server {
    listen 80;
    listen 443 ssl http2;
    server_name api.dollor.ai;

    # SSL Configuration (uncomment for production)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ===========================================
    # HEALTH CHECK
    # ===========================================
    location /health {
        return 200 '{"status": "healthy", "service": "api-gateway"}';
        add_header Content-Type application/json;
    }

    # ===========================================
    # AUTHENTICATION ROUTES -> auth-service:8001
    # ===========================================
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://auth-service/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # iOS-compatible customer login
    location /api/customer/login {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://p2p-backend/api/customer/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # RIDE ROUTES -> ride-service:8014
    # ===========================================
    location /api/rides/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://ride-service/api/rides/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ERP ride routes (frontend compatibility)
    location /api/erp/rides/ {
        limit_req zone=api_limit burst=50 nodelay;

        # Rewrite /api/erp/rides/* to /api/rides/*
        rewrite ^/api/erp/rides/(.*)$ /api/rides/$1 break;
        proxy_pass http://ride-service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # RESTAURANT ROUTES -> restaurant-service:8004
    # ===========================================
    location /api/restaurants/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://restaurant-service/api/restaurants/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ERP restaurant routes (frontend compatibility)
    location /api/erp/restaurants/ {
        limit_req zone=api_limit burst=50 nodelay;

        rewrite ^/api/erp/restaurants/(.*)$ /api/restaurants/$1 break;
        proxy_pass http://restaurant-service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # ORDER ROUTES -> order-service:8005
    # ===========================================
    location /api/orders/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://order-service/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ERP order routes
    location /api/erp/orders/ {
        limit_req zone=api_limit burst=50 nodelay;

        # First try P2P backend for full-tracking endpoint
        proxy_pass http://p2p-backend/api/erp/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # PAYMENT ROUTES -> payment-service:8006
    # ===========================================
    location /api/payments/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://payment-service/api/payments/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # LOCATION ROUTES -> location-service:8007
    # ===========================================
    location /api/locations/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://location-service/api/locations/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # MENU ROUTES -> menu-service:8008
    # ===========================================
    location /api/menus/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://menu-service/api/menus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # NOTIFICATION ROUTES -> notification-service:8009
    # ===========================================
    location /api/notifications/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://notification-service/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # RATING ROUTES -> rating-service:8013
    # ===========================================
    location /api/ratings/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://rating-service/api/ratings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # PRICING ROUTES -> pricing-service:8015
    # ===========================================
    location /api/pricing/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://pricing-service/api/pricing/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # DRIVER ROUTES -> driver-service:8003
    # ===========================================
    location /api/drivers/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://driver-service/api/drivers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # WEBSOCKET -> p2p-backend:8080
    # ===========================================
    location /ws/ {
        proxy_pass http://p2p-backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ===========================================
    # LEGAL & PUBLIC ROUTES -> p2p-backend:8080
    # ===========================================
    location /api/legal/ {
        proxy_pass http://p2p-backend/api/legal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/public/ {
        proxy_pass http://p2p-backend/api/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===========================================
    # DEFAULT -> p2p-backend:8080
    # ===========================================
    location / {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://p2p-backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error": "Service temporarily unavailable", "code": 503}';
        add_header Content-Type application/json;
    }
}
