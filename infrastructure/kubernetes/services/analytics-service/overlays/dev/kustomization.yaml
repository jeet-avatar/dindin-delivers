# Dollor.ai Analytics Service - Dev Environment
# ==============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dollor-dev

resources:
  - ../../deployment.yaml

commonLabels:
  environment: dev

replicas:
  - name: analytics-service
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
    target:
      kind: Deployment
      name: analytics-service

configMapGenerator:
  - name: analytics-service-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - ENABLE_KAFKA=false

images:
  - name: dollor/analytics-service
    newTag: dev
