# Dollor.ai Call Service - Production Overlay
# =============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: call-service
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: call-service
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

configMapGenerator:
  - name: call-service-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317

images:
  - name: dollor/call-service
    newTag: v1.0.0
