# Dollor.ai P2P Backend Service - Kustomize Base
# ================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: p2p-backend

namespace: production

commonLabels:
  app.kubernetes.io/name: p2p-backend
  app.kubernetes.io/component: p2p-platform
  app.kubernetes.io/part-of: dollor-platform

resources:
  - deployment.yaml

images:
  - name: dollor/p2p-backend
    newName: dollor/p2p-backend
    newTag: latest
