# Dollor.ai P2P Backend Service - Production Overlay
# ====================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: p2p-backend
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: p2p-backend
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 2000m
                    memory: 2Gi

configMapGenerator:
  - name: p2p-backend-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=720
      - PLATFORM_FEE_RATE=0.15
      - TAX_RATE=0.08
      - DELIVERY_FEE=5.99
      - AWS_S3_BUCKET=dollor-p2p-invoices-prod
      - AWS_REGION=us-east-1
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317

images:
  - name: dollor/p2p-backend
    newTag: v1.0.0
