# Dollor.ai P2P Backend Service - Kubernetes Service
# ===================================================

apiVersion: v1
kind: Service
metadata:
  name: p2p-backend
  labels:
    app: p2p-backend
    tier: backend
    domain: p2p
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: p2p-backend
