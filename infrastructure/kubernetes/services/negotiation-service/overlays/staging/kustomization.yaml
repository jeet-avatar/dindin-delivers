# Dollor.ai Negotiation Service - Staging Overlay
# =================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: negotiation-service
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: negotiation-service
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi

configMapGenerator:
  - name: negotiation-service-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317

images:
  - name: dollor/negotiation-service
    newTag: staging-latest
