# Dollor.ai P2P Frontend - Production Overlay
# =============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: p2p-frontend
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: p2p-frontend
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

images:
  - name: dollor/p2p-frontend
    newTag: v1.0.0
