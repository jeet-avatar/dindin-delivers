# Dollor.ai P2P Frontend - Staging Overlay
# ==========================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: p2p-frontend
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: p2p-frontend
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi

images:
  - name: dollor/p2p-frontend
    newTag: staging-latest
