# Dollor.ai P2P Frontend - Service
# ==================================

apiVersion: v1
kind: Service
metadata:
  name: p2p-frontend
  labels:
    app: p2p-frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: p2p-frontend
