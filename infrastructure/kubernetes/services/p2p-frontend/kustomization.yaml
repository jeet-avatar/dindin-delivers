# Dollor.ai P2P Frontend - Kustomize Base
# =========================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: p2p-frontend

namespace: production

commonLabels:
  app.kubernetes.io/name: p2p-frontend
  app.kubernetes.io/component: frontend
  app.kubernetes.io/part-of: dollor-platform

resources:
  - deployment.yaml

images:
  - name: dollor/p2p-frontend
    newName: dollor/p2p-frontend
    newTag: latest
