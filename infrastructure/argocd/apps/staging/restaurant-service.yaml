apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restaurant-service-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/env: staging
    app.kubernetes.io/part-of: dollor-platform
spec:
  project: dollor-staging
  source:
    repoURL: https://github.com/jeet-avatar/dindin-delivers.git
    targetRevision: main
    path: infrastructure/kubernetes/services/restaurant-service
    kustomize:
      images:
        - name: dollor/restaurant-service
          newTag: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: dollor-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
