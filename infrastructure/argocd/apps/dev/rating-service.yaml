apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rating-service-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: rating-service
    app.kubernetes.io/env: dev
    app.kubernetes.io/part-of: dollor-platform
spec:
  project: dollor-dev
  source:
    repoURL: https://github.com/jeet-avatar/dindin-delivers.git
    targetRevision: main
    path: infrastructure/kubernetes/services/rating-service
    kustomize:
      images:
        - name: dollor/rating-service
          newTag: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dollor-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
