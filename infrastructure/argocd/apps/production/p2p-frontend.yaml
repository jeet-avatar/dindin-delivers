apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p2p-frontend-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: p2p-frontend
    app.kubernetes.io/env: production
    app.kubernetes.io/part-of: dollor-platform
spec:
  project: dollor-production
  source:
    repoURL: https://github.com/jeet-avatar/dindin-delivers.git
    targetRevision: main
    path: infrastructure/kubernetes/services/p2p-frontend/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: dollor-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
