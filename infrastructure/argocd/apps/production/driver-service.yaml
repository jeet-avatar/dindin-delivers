# Dollor.ai Driver Service - ArgoCD Application (Production)
# ===========================================================
# Deploys driver-service to production environment
# REQUIRES EXECUTIVE APPROVAL

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: driver-service-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: driver-service
    app.kubernetes.io/component: driver-management
    app.kubernetes.io/part-of: dollor-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: dollor-releases
    notifications.argoproj.io/subscribe.on-sync-failed.slack: dollor-alerts
spec:
  project: dollor-production

  source:
    repoURL: https://github.com/dollor-ai/eatfair-ios.git
    targetRevision: HEAD
    path: infrastructure/kubernetes/services/driver-service/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  # Manual sync for production - no auto-deploy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: "Driver management service for Dollor.ai platform (Production)"
    - name: Port
      value: "8002"
    - name: Endpoints
      value: "/api/driver/*"
    - name: ApprovalRequired
      value: "Executive approval required for sync"
