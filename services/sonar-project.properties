# Dollor.ai Microservices - SonarQube Configuration
# ==================================================
# This is the root configuration for all microservices
# Each service can override these settings in their own sonar-project.properties

# Organization and Project
sonar.organization=dollor-ai
sonar.projectKey=dollor-microservices
sonar.projectName=Dollor.ai Microservices

# Source configuration
sonar.sources=core
sonar.sourceEncoding=UTF-8

# Python configuration
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/tests/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**,**/*.pyc

# Test configuration
sonar.tests=core/**/tests
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Coverage
sonar.python.coverage.reportPaths=core/**/coverage.xml

# Quality Gate
sonar.qualitygate.wait=true

# Duplicate detection
sonar.cpd.python.minimumTokens=50
sonar.cpd.python.minimumLines=10

# Issue severity overrides for security
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4144
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**

# Security hotspots
sonar.security.hotspots.inheritedRules=true
