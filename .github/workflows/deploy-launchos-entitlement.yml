name: Deploy LaunchOS Entitlement Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/launchos-entitlement/**'
    branches:
      - main
      - gsd/phase-22-launchos-smb-platform

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: launchos-entitlement
  ECS_SERVICE: launchos-entitlement-service
  ECS_CLUSTER: dollor-production
  CONTAINER_NAME: launchos-entitlement

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/launchos-entitlement/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            apps/launchos-entitlement/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Bootstrap or download task definition
        id: taskdef-bootstrap
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Always re-register task definition from committed template with current image
          # This ensures the latest template (no Secrets Manager, just env vars) is used
          echo "Registering task definition from template with image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # Update image in template to current build
          sed -i "s|134607809447.dkr.ecr.us-east-1.amazonaws.com/launchos-entitlement:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" apps/launchos-entitlement/task-definition.json
          aws ecs register-task-definition \
            --cli-input-json file://apps/launchos-entitlement/task-definition.json \
            --region $AWS_REGION
          aws ecs describe-task-definition \
            --task-definition launchos-entitlement \
            --query taskDefinition > task-definition.json

      - name: Bootstrap ECS service if needed
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" = "MISSING" ] || [ "$SERVICE_STATUS" = "None" ] || [ "$SERVICE_STATUS" = "INACTIVE" ]; then
            echo "Creating ECS service $ECS_SERVICE..."
            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $ECS_SERVICE \
              --task-definition launchos-entitlement \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration 'awsvpcConfiguration={subnets=[subnet-0364e2a6f013a5a00,subnet-0d10e7d90357dbec8],securityGroups=[sg-0f0300df4ba0989fe],assignPublicIp=DISABLED}' \
              --region $AWS_REGION
            echo "Service created — waiting 30s for stabilization"
            sleep 30
          else
            echo "ECS service already exists with status: $SERVICE_STATUS"
          fi

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
