name: Build MixMind Mac

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mixmind/**'
      - '.github/workflows/build-mixmind-mac.yml'

env:
  AWS_REGION: us-east-1
  S3_BUCKET: beatmind-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3F24X4TEVJ9X2

jobs:
  build-mac:
    name: Build Mac DMG (Signed + Notarized)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Import signing certificate ────────────────────────────────────────
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain
          rm /tmp/certificate.p12

      # ── Python sidecar ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sidecar dependencies
        working-directory: apps/mixmind/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar with PyInstaller
        working-directory: apps/mixmind/sidecar
        run: pyinstaller mixmind-sidecar.spec --noconfirm --clean

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mixmind/frontend/package-lock.json

      - name: Build frontend
        working-directory: apps/mixmind/frontend
        run: |
          npm ci
          npm run build

      # ── Electron DMG — sign + notarize ────────────────────────────────────
      - name: Install Electron dependencies
        working-directory: apps/mixmind/electron
        run: npm ci

      - name: Build, sign and notarize Mac DMG
        working-directory: apps/mixmind/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_NAME: "Developer ID Application: Zietra Technologies inc (PRKZ4UVCD7)"
          APPLE_API_KEY_ID: "9K626GB728"
          APPLE_API_KEY_ISSUER: "80d10e49-f379-462f-9668-5ea53016812e"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Write the API key to a temp file (electron-builder reads from path)
          echo "$APPLE_API_KEY" > /tmp/AuthKey_9K626GB728.p8
          export APPLE_API_KEY=/tmp/AuthKey_9K626GB728.p8

          npx electron-builder --mac --publish=never

          rm -f /tmp/AuthKey_9K626GB728.p8

      - name: Find DMG
        id: find-dmg
        working-directory: apps/mixmind/electron/dist
        run: |
          DMG=$(ls *.dmg 2>/dev/null | head -1)
          echo "Found: $DMG ($(du -sh "$DMG" | cut -f1))"
          echo "dmg_path=$(pwd)/$DMG" >> $GITHUB_OUTPUT
          echo "dmg_name=$DMG" >> $GITHUB_OUTPUT

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type open --context context:primary-signature -v \
            "${{ steps.find-dmg.outputs.dmg_path }}" 2>&1

      # ── Upload to S3 ──────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp "${{ steps.find-dmg.outputs.dmg_path }}" \
            "s3://${{ env.S3_BUCKET }}/MixMind-mac.dmg" \
            --content-type "application/x-apple-diskimage" \
            --content-disposition "attachment; filename=MixMind-mac.dmg" \
            --no-progress
          echo "Uploaded: MixMind-mac.dmg"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/MixMind-mac.dmg" \
            --query "Invalidation.Id" --output text)
          echo "Invalidation: $ID"

      - name: Summary
        run: |
          echo "====================================="
          echo "MixMind Mac Build Complete!"
          echo "====================================="
          echo "DMG: ${{ steps.find-dmg.outputs.dmg_name }}"
          echo "Live at: https://www.beatmind.io/MixMind-mac.dmg"
