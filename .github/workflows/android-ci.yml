name: Android CI/CD

on:
  push:
    branches: [ main, develop, staging, feature/* ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, develop, staging ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json files
        run: |
          mkdir -p app/src/debug app/src/release
          mkdir -p driver/src/debug driver/src/release
          mkdir -p partner/src/debug partner/src/release

          # Customer app config
          CUSTOMER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.customer"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$CUSTOMER_CONFIG" > app/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/debug/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/release/google-services.json

          # Driver app config
          DRIVER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.driver"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$DRIVER_CONFIG" > driver/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/debug/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/release/google-services.json

          # Partner app config
          PARTNER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:848e20410a71543283ecf7","android_client_info":{"package_name":"ai.dollor.partner"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$PARTNER_CONFIG" > partner/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/debug/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/release/google-services.json

      - name: Run Lint
        run: ./gradlew :app:lintDebug :driver:lintDebug :partner:lintDebug :shared:lint --continue || true
        # Note: Using || true because Android Lint has known bugs with Kotlin test analysis

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: 'apps/android/**/build/reports/lint-results*.html'

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json files
        run: |
          mkdir -p app/src/debug app/src/release
          mkdir -p driver/src/debug driver/src/release
          mkdir -p partner/src/debug partner/src/release

          CUSTOMER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.customer"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$CUSTOMER_CONFIG" > app/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/debug/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/release/google-services.json

          DRIVER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.driver"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$DRIVER_CONFIG" > driver/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/debug/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/release/google-services.json

          PARTNER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:848e20410a71543283ecf7","android_client_info":{"package_name":"ai.dollor.partner"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$PARTNER_CONFIG" > partner/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/debug/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/release/google-services.json

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :driver:testDebugUnitTest :partner:testDebugUnitTest :shared:testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'apps/android/**/build/test-results/**/*.xml'

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    defaults:
      run:
        working-directory: apps/android
    strategy:
      matrix:
        module: [app, partner, driver]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json files
        run: |
          mkdir -p app/src/debug app/src/release
          mkdir -p driver/src/debug driver/src/release
          mkdir -p partner/src/debug partner/src/release

          CUSTOMER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.customer"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$CUSTOMER_CONFIG" > app/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/debug/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/release/google-services.json

          DRIVER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.driver"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$DRIVER_CONFIG" > driver/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/debug/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/release/google-services.json

          PARTNER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:848e20410a71543283ecf7","android_client_info":{"package_name":"ai.dollor.partner"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$PARTNER_CONFIG" > partner/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/debug/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/release/google-services.json

      - name: Build Debug APK
        run: ./gradlew :${{ matrix.module }}:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-debug-apk
          path: apps/android/${{ matrix.module }}/build/outputs/apk/debug/*.apk

  release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json files
        run: |
          mkdir -p app/src/debug app/src/release
          mkdir -p driver/src/debug driver/src/release
          mkdir -p partner/src/debug partner/src/release

          CUSTOMER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.customer"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$CUSTOMER_CONFIG" > app/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/debug/google-services.json
          echo "$CUSTOMER_CONFIG" > app/src/release/google-services.json

          DRIVER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:0bd156d8e81170ac83ecf7","android_client_info":{"package_name":"ai.dollor.driver"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$DRIVER_CONFIG" > driver/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/debug/google-services.json
          echo "$DRIVER_CONFIG" > driver/src/release/google-services.json

          PARTNER_CONFIG='{"project_info":{"project_number":"107524350806","project_id":"eatfair-app","storage_bucket":"eatfair-app.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:107524350806:android:848e20410a71543283ecf7","android_client_info":{"package_name":"ai.dollor.partner"}},"api_key":[{"current_key":"AIzaSyAepfv31h7GlkJE3oWT-hfrfkQZQAAq13M"}]}],"configuration_version":"1"}'
          echo "$PARTNER_CONFIG" > partner/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/debug/google-services.json
          echo "$PARTNER_CONFIG" > partner/src/release/google-services.json

      - name: Build Release APKs
        run: |
          ./gradlew :app:assembleRelease :driver:assembleRelease :partner:assembleRelease

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/driver/build/outputs/apk/release/*.apk
            apps/android/partner/build/outputs/apk/release/*.apk
