name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Debug - Start
        run: echo "Workflow started successfully"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install P2P backend dependencies
        working-directory: apps/web/p2p-platform/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Install microservices shared dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib python-jose bcrypt httpx

      - name: Run P2P backend tests with coverage
        working-directory: apps/web/p2p-platform/backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          TESTING: "true"
        run: |
          pytest tests/unit/test_security_helpers.py \
            tests/unit/test_email_service.py \
            tests/unit/test_document_verification.py \
            tests/unit/test_api_config.py \
            tests/unit/test_models.py \
            tests/unit/test_promotions.py \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short

      - name: Run all 16 microservices tests
        continue-on-error: true
        env:
          SECRET_KEY: test-secret-key-for-ci
          TESTING: "true"
          PYTHONPATH: ${{ github.workspace }}/services/shared
        run: |
          set +e  # Don't exit on error
          echo "=========================================="
          echo "Running tests for all 16 microservices"
          echo "=========================================="

          SERVICES=(
            "auth-service"
            "user-service"
            "driver-service"
            "restaurant-service"
            "order-service"
            "payment-service"
            "location-service"
            "menu-service"
            "notification-service"
            "rating-service"
            "ride-service"
            "pricing-service"
            "analytics-service"
            "negotiation-service"
            "chat-service"
            "call-service"
          )

          PASSED=0
          FAILED=0

          for service in "${SERVICES[@]}"; do
            echo ""
            echo ">>> Testing $service..."
            cd ${{ github.workspace }}/services/core/$service
            if python -m pytest tests/ -v --tb=short 2>&1; then
              echo "✓ $service: PASSED"
              PASSED=$((PASSED + 1))
            else
              echo "⚠ $service: SOME TESTS FAILED (continuing...)"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=========================================="
          echo "MICROSERVICES TEST SUMMARY"
          echo "=========================================="
          echo "Total Services: ${#SERVICES[@]}"
          echo "Passed: $PASSED"
          echo "With Failures: $FAILED"
          echo "=========================================="
          exit 0  # Always succeed - microservice tests are informational

      - name: Check SonarCloud Token
        id: check-token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::SONAR_TOKEN not configured - skipping SonarCloud analysis"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: SonarCloud Scan
        if: steps.check-token.outputs.skip != 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=apps/web/p2p-platform/backend/coverage.xml
            -Dsonar.coverage.exclusions=**/tests/**,**/*_test.py,**/test_*.py
