name: Deploy BeatMind

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ableton-chatbot/**'
      - '.github/workflows/deploy-beatmind.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: musai-api
  ECS_CLUSTER: dollor-production
  ECS_SERVICE: beatmind-api-service
  S3_BUCKET: beatmind-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3F24X4TEVJ9X2

jobs:
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        working-directory: apps/ableton-chatbot/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment
          echo "Waiting for service stability..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s https://api.beatmind.io/api/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" = "ok" ]; then
            echo "Deployment verified: API is healthy"
          else
            echo "WARNING: API health check returned: $STATUS"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to CloudFront
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[frontend]') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ableton-chatbot/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/ableton-chatbot/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/ableton-chatbot/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.beatmind.io

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: apps/ableton-chatbot/frontend
        run: aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "==================================="
          echo "BeatMind Deployment Complete!"
          echo "==================================="
          echo ""
          echo "Production URLs:"
          echo "  Frontend: https://www.beatmind.io"
          echo "  API: https://api.beatmind.io"
