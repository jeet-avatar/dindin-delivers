name: Deploy BeatMind

on:
  pull_request:
    paths:
      - 'apps/ableton-chatbot/**'
      - '.github/workflows/deploy-beatmind.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/ableton-chatbot/**'
      - '.github/workflows/deploy-beatmind.yml'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run regression checks without publishing
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: musai-api
  ECS_CLUSTER: dollor-production
  ECS_SERVICE: beatmind-api-service
  S3_BUCKET: beatmind-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3F24X4TEVJ9X2

jobs:
  test:
    name: Validate Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: beatmind_ci_test_only
          POSTGRES_DB: beatmind_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audio comparison test runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xauth
      - name: Backend regression tests
        working-directory: apps/ableton-chatbot/backend
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          pip install torch==2.6.0+cpu torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-test.txt -r requirements-reference.txt -r ../bridge/requirements.txt
          DB_BACKEND=sqlite python -m pytest tests -q
          DB_BACKEND=postgres DATABASE_URL=postgresql://postgres:beatmind_ci_test_only@localhost:5432/beatmind_release_test python -m pytest tests -q
      - name: Bridge regression tests
        working-directory: apps/ableton-chatbot/bridge
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: xvfb-run -a python -m pytest tests -q
      - name: Frontend regression tests and production build
        working-directory: apps/ableton-chatbot/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.beatmind.io
          NEXT_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          npm ci
          node --test tests/*.test.cjs
          npm run build

      - name: Automatic remix browser and real audio checks
        working-directory: apps/ableton-chatbot/frontend
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/beatmind-browser" playwright@1.58.0
          "$RUNNER_TEMP/beatmind-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/beatmind-browser/node_modules/playwright" \
            BEATMIND_TEST_PYTHON="$(command -v python)" node tests/automatic-remix.browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/beatmind-browser/node_modules/playwright" \
            BEATMIND_TEST_PYTHON="$(command -v python)" BEATMIND_TEST_IMPORT_ENABLED=0 node tests/automatic-remix.browser.cjs

      - name: Save verified frontend export
        uses: actions/upload-artifact@v4
        with:
          name: beatmind-frontend-${{ github.sha }}
          path: apps/ableton-chatbot/frontend/out/
          retention-days: 14

  deploy-backend:
    name: Deploy Backend to ECS
    needs: [test]
    if: github.event_name != 'pull_request' && inputs.validate_only != true
    runs-on: ubuntu-latest
    outputs:
      task_definition: ${{ steps.register-task-def.outputs.task_def_arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        working-directory: apps/ableton-chatbot/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker run --rm --platform linux/amd64 --network none --memory 6g --cpus 2 \
            --env PYTHONPATH=/app \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/ableton-chatbot/scripts/release_runtime_smoke.py,target=/tmp/release_runtime_smoke.py,readonly" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG python /tmp/release_runtime_smoke.py
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Register task definition with image and audio secret reference
        id: register-task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          TASK_DIR=$(mktemp -d)
          trap 'rm -rf "$TASK_DIR"' EXIT
          # Resolve metadata only. The key value is fetched by ECS, never this job.
          export AUDIO_SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id beatmind/production/audio-provider \
            --query ARN --output text)
          export RELEASE_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query 'taskDefinition' \
            --output json > "$TASK_DIR/current.json"
          python3 apps/ableton-chatbot/scripts/prepare_audio_task.py \
            "$TASK_DIR/current.json" "$TASK_DIR/prepared.json"

          # Register the updated task definition
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "file://$TASK_DIR/prepared.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered task definition: $NEW_REVISION"
          echo "task_def_arn=$NEW_REVISION" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }}
          echo "Waiting for service stability..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s https://api.beatmind.io/api/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" = "ok" ]; then
            echo "Deployment verified: API is healthy"
          else
            echo "WARNING: API health check returned: $STATUS"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to CloudFront
    needs: [test, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified frontend export
        uses: actions/download-artifact@v4
        with:
          name: beatmind-frontend-${{ github.sha }}
          path: apps/ableton-chatbot/frontend/out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: apps/ableton-chatbot/frontend
        # Preserve installers, model files, release history and chunks used by open tabs.
        run: |
          aws s3 sync out/_next/ s3://${{ env.S3_BUCKET }}/_next/ --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ --exclude '_next/*' --exclude 'release.json' --cache-control 'no-cache'

      - name: Publish release identity
        env:
          RELEASE_TASK: ${{ needs.deploy-backend.outputs.task_definition }}
        run: |
          aws s3 cp s3://${{ env.S3_BUCKET }}/release.json /tmp/beatmind-previous-release.json
          python3 apps/ableton-chatbot/scripts/write_release_manifest.py \
            /tmp/beatmind-previous-release.json /tmp/beatmind-release.json \
            --commit "$GITHUB_SHA" --task "$RELEASE_TASK"
          aws s3 cp /tmp/beatmind-release.json s3://${{ env.S3_BUCKET }}/release.json --content-type application/json --cache-control no-store

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test, deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "==================================="
          echo "Validation: ${{ needs.test.result }}"
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          echo "==================================="
          echo ""
          echo "Production URLs:"
          echo "  Frontend: https://www.beatmind.io"
          echo "  API: https://api.beatmind.io"
