 name: iOS CI/CD (Staging Only)

  on:
    push:
      branches: [ staging ]
    pull_request:
      branches: [ staging ]
    workflow_dispatch:
      inputs:
        upload_to_testflight:
          description: 'Upload to TestFlight'
          required: true
          default: 'true'
          type: boolean

  env:
    XCODE_VERSION: '16.1'

  jobs:
    lint:
      name: SwiftLint
      runs-on: macos-14
      steps:
        - uses: actions/checkout@v4

        - name: Install SwiftLint
          run: brew install swiftlint

        - name: Run SwiftLint
          run: swiftlint lint --reporter github-actions-logging --config .swiftlint.yml || true

    build-shared:
      name: Build Shared Module
      runs-on: macos-14
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Build EatFairShared
          run: |
            cd apps/ios/eatfair-ios-shared
            xcodebuild -scheme EatFairShared -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' build

    build-customer:
      name: Build Customer App
      runs-on: macos-14
      needs: build-shared
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Install CocoaPods
          run: |
            cd apps/ios/customer
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist
          run: |
            echo '${{ secrets.GOOGLE_SERVICE_INFO_CUSTOMER }}' > apps/ios/customer/eatfaircustomer/GoogleService-Info.plist

        - name: Build Customer App
          run: |
            cd apps/ios/customer
            xcodebuild build \
              -workspace eatfaircustomer.xcworkspace \
              -scheme eatfaircustomer \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || xcodebuild build \
                -project eatfaircustomer.xcodeproj \
                -scheme eatfaircustomer \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
                -configuration Debug \
                CODE_SIGNING_ALLOWED=NO

    build-restaurant:
      name: Build Restaurant App
      runs-on: macos-14
      needs: build-shared
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Install CocoaPods
          run: |
            cd apps/ios/restaurant
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist
          run: |
            echo '${{ secrets.GOOGLE_SERVICE_INFO_RESTAURANT }}' > apps/ios/restaurant/eatffairrestaurant/GoogleService-Info.plist

        - name: Build Restaurant App
          run: |
            cd apps/ios/restaurant
            xcodebuild build \
              -workspace eatffairrestaurant.xcworkspace \
              -scheme eatffairrestaurant \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || xcodebuild build \
                -project eatffairrestaurant.xcodeproj \
                -scheme eatffairrestaurant \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
                -configuration Debug \
                CODE_SIGNING_ALLOWED=NO

    build-delivery:
      name: Build Delivery App
      runs-on: macos-14
      needs: build-shared
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Install CocoaPods
          run: |
            cd apps/ios/delivery
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist
          run: |
            echo '${{ secrets.GOOGLE_SERVICE_INFO_DELIVERY }}' > apps/ios/delivery/eatffairdelivery/GoogleService-Info.plist

        - name: Build Delivery App
          run: |
            cd apps/ios/delivery
            xcodebuild build \
              -workspace eatffairdelivery.xcworkspace \
              -scheme eatffairdelivery \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || xcodebuild build \
                -project eatffairdelivery.xcodeproj \
                -scheme eatffairdelivery \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
                -configuration Debug \
                CODE_SIGNING_ALLOWED=NO

    test:
      name: Run Tests
      runs-on: macos-14
      needs: [build-customer, build-restaurant, build-delivery]
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Install CocoaPods (Customer)
          run: |
            cd apps/ios/customer
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist (Customer)
          run: |
            echo '${{ secrets.GOOGLE_SERVICE_INFO_CUSTOMER }}' > apps/ios/customer/eatfaircustomer/GoogleService-Info.plist

        - name: Run Customer App Tests
          run: |
            cd apps/ios/customer
            xcodebuild test \
              -workspace eatfaircustomer.xcworkspace \
              -scheme eatfaircustomer \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
              -resultBundlePath TestResults/customer \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --report junit --output TestResults/customer-junit.xml || true

        - name: Install CocoaPods (Delivery)
          run: |
            cd apps/ios/delivery
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist (Delivery)
          run: |
            echo '${{ secrets.GOOGLE_SERVICE_INFO_DELIVERY }}' > apps/ios/delivery/eatffairdelivery/GoogleService-Info.plist

        - name: Run Delivery App Tests
          run: |
            cd apps/ios/delivery
            xcodebuild test \
              -workspace eatffairdelivery.xcworkspace \
              -scheme eatffairdelivery \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
              -resultBundlePath TestResults/delivery \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --report junit --output TestResults/delivery-junit.xml || true

        - name: Upload Test Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: |
              apps/ios/*/TestResults/**
              apps/ios/*/*.xml

    # Archive and upload to TestFlight using Fastlane
    testflight:
      name: Upload to TestFlight (Staging)
      runs-on: macos-14
      needs: test
      if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event.inputs.upload_to_testflight == 'true')
      strategy:
        matrix:
          include:
            - app: customer
              workspace: eatfaircustomer.xcworkspace
              scheme: eatfaircustomer
              dir: customer
            - app: restaurant
              workspace: eatffairrestaurant.xcworkspace
              scheme: eatffairrestaurant
              dir: restaurant
            - app: delivery
              workspace: eatffairdelivery.xcworkspace
              scheme: eatffairdelivery
              dir: delivery
      steps:
        - uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

        - name: Install Fastlane
          run: |
            gem install fastlane -v '~> 2.219.0' --no-document
            fastlane --version

        - name: Setup App Store Connect API Key
          env:
            APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          run: |
            mkdir -p apps/ios/${{ matrix.dir }}/fastlane/keys
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > apps/ios/${{ matrix.dir }}/fastlane/keys/AuthKey_JFVA7628SX.p8

        - name: Install CocoaPods
          run: |
            cd apps/ios/${{ matrix.dir }}
            pod install --repo-update || echo "Pods may not be configured"

        - name: Create GoogleService-Info.plist
          run: |
            SECRET_NAME="GOOGLE_SERVICE_INFO_$(echo ${{ matrix.app }} | tr '[:lower:]' '[:upper:]')"
            if [ "${{ matrix.app }}" = "customer" ]; then
              echo '${{ secrets.GOOGLE_SERVICE_INFO_CUSTOMER }}' > apps/ios/customer/eatfaircustomer/GoogleService-Info.plist
            elif [ "${{ matrix.app }}" = "restaurant" ]; then
              echo '${{ secrets.GOOGLE_SERVICE_INFO_RESTAURANT }}' > apps/ios/restaurant/eatffairrestaurant/GoogleService-Info.plist
            elif [ "${{ matrix.app }}" = "delivery" ]; then
              echo '${{ secrets.GOOGLE_SERVICE_INFO_DELIVERY }}' > apps/ios/delivery/eatffairdelivery/GoogleService-Info.plist
            fi

        - name: Build and Upload to TestFlight with Fastlane
          run: |
            cd apps/ios/${{ matrix.dir }}

            # Create .env file for Fastlane
            cat > fastlane/.env << EOF
            APPLE_ID="jeetnair.in@gmail.com"
            TEAM_ID="YRHVAY595K"
            APP_STORE_CONNECT_API_KEY_ID="JFVA7628SX"
            APP_STORE_CONNECT_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
            APP_STORE_CONNECT_API_KEY_PATH="./fastlane/keys/AuthKey_JFVA7628SX.p8"
            CI_BUILD_NUMBER="${{ github.run_number }}"
            EOF

            # Run Fastlane beta lane
            fastlane beta
          env:
            MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

        - name: Upload Build Logs
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.app }}-fastlane-logs
            path: |
              apps/ios/${{ matrix.dir }}/fastlane/report.xml
              apps/ios/${{ matrix.dir }}/fastlane/Preview.html
