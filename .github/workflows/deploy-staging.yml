name: Deploy to Staging

on:
  push:
    branches:
      - staging
      - develop
    paths:
      - 'apps/web/p2p-platform/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  S3_BUCKET: dollar-ai-staging-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STAGING_CLOUDFRONT_ID }}
  EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
  # Use same ECR repo as production for code consistency
  ECR_REPOSITORY: dollor-api
  # Use production cluster (staging service runs in same cluster)
  ECS_CLUSTER: dollor-production
  ECS_SERVICE: dollor-api-staging-service
  ECS_TASK_DEFINITION: dollor-api-staging

jobs:
  # Run tests first - following CLAUDE.md guidelines
  run-tests:
    name: Run Tests (SonarCloud Gate)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: apps/web/p2p-platform/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run P2P backend tests
        working-directory: apps/web/p2p-platform/backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          TESTING: "true"
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run microservices tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          TESTING: "true"
          PYTHONPATH: ${{ github.workspace }}/services/shared
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib python-jose bcrypt httpx

          SERVICES=(
            "auth-service"
            "user-service"
            "driver-service"
            "restaurant-service"
            "order-service"
            "payment-service"
            "location-service"
            "menu-service"
            "notification-service"
            "rating-service"
            "ride-service"
            "pricing-service"
            "analytics-service"
            "negotiation-service"
            "chat-service"
            "call-service"
          )

          PASSED=0
          FAILED=0

          for service in "${SERVICES[@]}"; do
            echo ">>> Testing $service..."
            cd ${{ github.workspace }}/services/core/$service
            if python -m pytest tests/ -v --tb=short 2>&1; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done

          echo "Passed: $PASSED / ${#SERVICES[@]}"
          if [ $FAILED -gt 0 ]; then
            echo "::warning::$FAILED services have test failures"
          fi

  deploy-staging-frontend:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: run-tests
    if: always() && (needs.run-tests.result == 'success' || github.event.inputs.skip_tests == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/p2p-platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/p2p-platform/frontend
        run: npm ci

      - name: Build frontend for staging
        working-directory: apps/web/p2p-platform/frontend
        run: npm run build
        env:
          VITE_API_URL: https://d3kuu45w6kl8hr.cloudfront.net
          VITE_APP_NAME: Dollor.ai (Staging)
          VITE_ENVIRONMENT: staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: apps/web/p2p-platform/frontend
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-staging-ecs:
    name: Deploy Backend to Staging ECS
    runs-on: ubuntu-latest
    needs: run-tests
    if: always() && (needs.run-tests.result == 'success' || github.event.inputs.skip_tests == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        working-directory: apps/web/p2p-platform/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Staging ECS deployment complete!"

  deploy-staging-eks:
    name: Deploy Backend to Staging EKS
    runs-on: ubuntu-latest
    needs: deploy-staging-ecs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name dollor-staging

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Update p2p-api deployment in dollor-staging namespace
          echo "Updating p2p-api deployment..."
          kubectl set image deployment/p2p-api \
            p2p-api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n dollor-staging || echo "p2p-api deployment not found, skipping"

          # Update p2p-backend deployment in default namespace
          echo "Updating p2p-backend deployment..."
          kubectl set image deployment/p2p-backend \
            p2p-backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n default || echo "p2p-backend deployment not found, skipping"

          # Wait for rollouts
          kubectl rollout status deployment/p2p-api -n dollor-staging --timeout=300s || true
          kubectl rollout status deployment/p2p-backend -n default --timeout=300s || true

          echo "Staging EKS deployment complete!"

  deploy-staging-backend:
    name: Deploy Backend to Staging EC2
    runs-on: ubuntu-latest
    needs: deploy-staging-frontend
    # Skip if STAGING_EC2_HOST secret is not configured
    if: ${{ vars.STAGING_EC2_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend to Staging EC2
        run: |
          rsync -avz --exclude 'venv' --exclude '__pycache__' --exclude '*.pyc' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            apps/web/p2p-platform/backend/ ec2-user@${{ env.EC2_HOST }}:/opt/dollor-backend/

      - name: Install dependencies and restart service
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} << 'EOF'
            cd /opt/dollor-backend

            if [ ! -d "venv" ]; then
              python3.11 -m venv venv
            fi

            source venv/bin/activate
            pip install -r requirements.txt

            # Run database migrations and seed staging data
            echo "🌱 Seeding staging database..."
            python seed_menu_items.py || echo "Seed script completed with warnings"

            # Restart the service
            if command -v pm2 &> /dev/null; then
              pm2 restart dollor-backend-staging || pm2 start "uvicorn main_new:app --host 0.0.0.0 --port 3000" --name dollor-backend-staging
            else
              pkill -f "uvicorn main_new:app" || true
              nohup uvicorn main_new:app --host 0.0.0.0 --port 3000 > /var/log/dollor-backend.log 2>&1 &
            fi

            echo "✅ Staging backend deployment complete!"
          EOF

  notify-staging:
    name: Staging Deployment Summary
    runs-on: ubuntu-latest
    needs: [run-tests, deploy-staging-frontend, deploy-staging-ecs, deploy-staging-eks]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "==================================="
          echo "Staging Deployment Complete!"
          echo "==================================="
          echo ""
          echo "Staging URLs:"
          echo "  Frontend: https://staging.dollor.ai"
          echo "  API: https://staging-api.dollor.ai"
          echo ""
          echo "Test this environment before promoting to production."
          echo ""
          echo "To promote to production:"
          echo "  1. Verify all features work on staging"
          echo "  2. Create PR from staging/develop to main"
          echo "  3. Get approval and merge"
          echo "  4. Production deploy will trigger automatically"
