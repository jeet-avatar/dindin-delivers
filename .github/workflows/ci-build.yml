name: CI - Build & Push

on:
  push:
    branches: [develop, staging, main]
    paths:
      - 'apps/web/p2p-platform/backend/**'
      - 'apps/web/p2p-platform/frontend/**'
      - '.github/workflows/ci-build.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BACKEND: dollor-api
  ECR_REPOSITORY_FRONTEND: dollor-frontend

jobs:
  # ============================================
  # JOB 1: DETERMINE ENVIRONMENT
  # ============================================
  setup:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    steps:
      - name: Set environment based on branch
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  # ============================================
  # JOB 2: BUILD BACKEND
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      security-events: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        working-directory: apps/web/p2p-platform/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG

          docker build \
            --build-arg ENVIRONMENT=$ENVIRONMENT \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$ENVIRONMENT-latest \
            .

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ============================================
      # TRIVY VULNERABILITY SCAN
      # ============================================
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy scan (table output)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$ENVIRONMENT-latest

  # ============================================
  # JOB 3: BUILD FRONTEND
  # ============================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      security-events: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        working-directory: apps/web/p2p-platform/frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Determine API URL based on environment
          if [ "$ENVIRONMENT" == "production" ]; then
            API_URL="https://api.dollor.ai"
          elif [ "$ENVIRONMENT" == "staging" ]; then
            API_URL="https://staging-api.dollor.ai"
          else
            API_URL="https://dev-api.dollor.ai"
          fi

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG

          docker build \
            --build-arg VITE_API_URL=$API_URL \
            --build-arg VITE_ENVIRONMENT=$ENVIRONMENT \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$ENVIRONMENT-latest \
            .

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend-results.sarif'

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$ENVIRONMENT-latest

  # ============================================
  # JOB 4: UPDATE HELM VALUES (GITOPS)
  # ============================================
  update-helm:
    name: Update Helm Values (GitOps)
    runs-on: ubuntu-latest
    needs: [setup, build-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tag
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Update the values file for the target environment
          VALUES_FILE="infrastructure/helm/backend/values-${ENVIRONMENT}.yaml"

          if [ -f "$VALUES_FILE" ]; then
            # Use yq to update the image tag
            yq -i ".image.tag = \"$IMAGE_TAG\"" "$VALUES_FILE"

            echo "Updated $VALUES_FILE with image tag: $IMAGE_TAG"
          else
            echo "Values file $VALUES_FILE not found, skipping update"
          fi

      - name: Commit and push changes
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update $ENVIRONMENT image tag to $IMAGE_TAG [skip ci]"
            git push
          fi

  # ============================================
  # JOB 5: NOTIFY
  # ============================================
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [setup, build-backend, build-frontend, update-helm]
    if: always()
    steps:
      - name: Build Summary
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          echo "========================================"
          echo "BUILD & PUSH COMPLETE"
          echo "========================================"
          echo ""
          echo "Environment: $ENVIRONMENT"
          echo "Image Tag: $IMAGE_TAG"
          echo ""
          echo "Backend Image: ${{ needs.build-backend.outputs.image }}"
          echo "Frontend Image: ${{ needs.build-frontend.outputs.image }}"
          echo ""
          echo "ArgoCD will automatically sync the changes"
          echo "========================================"
