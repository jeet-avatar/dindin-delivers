name: Deploy to Dollor.ai

on:
  push:
    branches:
      - main
      - feature/dollar-ai-deployment
    paths:
      - 'apps/web/p2p-platform/**'
      - '.github/workflows/deploy-dollar-ai.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: dollar-ai-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E1TL8YTTU1SF3A
  EC2_HOST: 44.192.34.143
  ECR_REPOSITORY: dollor-api
  ECS_CLUSTER: dollor-production
  ECS_SERVICE: dollor-api-service

jobs:
  deploy-frontend:
    name: Deploy Frontend to CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/p2p-platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/p2p-platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/web/p2p-platform/frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.dollor.ai
          VITE_APP_NAME: Dollor.ai
          VITE_ENVIRONMENT: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: apps/web/p2p-platform/frontend
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend to EC2
        run: |
          # Sync backend files (excluding venv and __pycache__)
          rsync -avz --exclude 'venv' --exclude '__pycache__' --exclude '*.pyc' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            apps/web/p2p-platform/backend/ ec2-user@${{ env.EC2_HOST }}:/opt/dollor-backend/

      - name: Configure SMTP environment on EC2
        run: |
          # Set ENVIRONMENT=production
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && touch .env && (grep -q '^ENVIRONMENT=' .env && sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=production/' .env || echo 'ENVIRONMENT=production' >> .env)"

          # Set SMTP_HOST
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && (grep -q '^SMTP_HOST=' .env && sed -i 's|^SMTP_HOST=.*|SMTP_HOST=${{ secrets.SMTP_HOST }}|' .env || echo 'SMTP_HOST=${{ secrets.SMTP_HOST }}' >> .env)"

          # Set SMTP_PORT
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && (grep -q '^SMTP_PORT=' .env && sed -i 's|^SMTP_PORT=.*|SMTP_PORT=${{ secrets.SMTP_PORT }}|' .env || echo 'SMTP_PORT=${{ secrets.SMTP_PORT }}' >> .env)"

          # Set SMTP_USER
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && (grep -q '^SMTP_USER=' .env && sed -i 's|^SMTP_USER=.*|SMTP_USER=${{ secrets.SMTP_USER }}|' .env || echo 'SMTP_USER=${{ secrets.SMTP_USER }}' >> .env)"

          # Set SMTP_PASSWORD
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && (grep -q '^SMTP_PASSWORD=' .env && sed -i 's|^SMTP_PASSWORD=.*|SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}|' .env || echo 'SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}' >> .env)"

          # Set FROM_EMAIL
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} "cd /opt/dollor-backend && (grep -q '^FROM_EMAIL=' .env || echo 'FROM_EMAIL=noreply@dollor.ai' >> .env)"

          echo "SMTP environment configured on EC2"

      - name: Install dependencies and restart service
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} << 'EOF'
            cd /opt/dollor-backend

            # Verify .env configuration
            echo "=== Verifying .env configuration ==="
            echo "ENVIRONMENT=$(grep '^ENVIRONMENT=' .env | cut -d'=' -f2)"
            echo "SMTP_HOST=$(grep '^SMTP_HOST=' .env | cut -d'=' -f2 | head -c 20)..."
            echo "SMTP_USER set: $(grep -q '^SMTP_USER=' .env && echo 'yes' || echo 'no')"
            echo "SMTP_PASSWORD set: $(grep -q '^SMTP_PASSWORD=' .env && echo 'yes' || echo 'no')"

            # Activate existing venv and fix urllib3 compatibility
            source venv/bin/activate
            pip install 'urllib3<2' -q 2>/dev/null || true

            # Force kill ALL uvicorn and python processes related to the app
            echo "=== Restarting backend service ==="
            echo "Killing existing processes..."
            pkill -9 -f "uvicorn" 2>/dev/null || true
            pkill -9 -f "main_new:app" 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 3

            # Verify port is free
            if netstat -tuln 2>/dev/null | grep -q ":3000 "; then
              echo "WARNING: Port 3000 still in use!"
              fuser -k 3000/tcp 2>/dev/null || true
              sleep 2
            fi

            # Start uvicorn directly (dotenv is loaded in main_new.py already)
            cd /opt/dollor-backend
            source venv/bin/activate
            export $(grep -v '^#' .env | xargs)  # Export .env variables to shell
            nohup uvicorn main_new:app --host 0.0.0.0 --port 3000 > /opt/dollor-backend/backend.log 2>&1 &

            sleep 5
            UVICORN_PID=$(pgrep -f 'uvicorn')
            echo "Process started with PID: $UVICORN_PID"

            # Verify it's running and responding
            if [ -n "$UVICORN_PID" ]; then
              echo "Backend service started successfully!"
              sleep 2
              curl -s http://localhost:3000/health | head -c 100 || echo "Health check pending..."
            else
              echo "ERROR: Backend service failed to start!"
              cat /opt/dollor-backend/backend.log
              exit 1
            fi
          EOF

  deploy-ecs:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        working-directory: apps/web/p2p-platform/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "ECS deployment complete!"

  deploy-eks:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: deploy-ecs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name dollor-staging

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Find the namespace where p2p-backend deployment exists
          echo "Looking for p2p-backend deployment..."
          NAMESPACE=$(kubectl get deployments --all-namespaces -o json | jq -r '.items[] | select(.metadata.name=="p2p-backend") | .metadata.namespace' | head -1)

          if [ -z "$NAMESPACE" ] || [ "$NAMESPACE" == "null" ]; then
            echo "Deployment not found, creating in default namespace..."
            NAMESPACE="default"
            # Apply the K8s manifest with updated image tag
            sed "s|134607809447.dkr.ecr.us-east-1.amazonaws.com/dollor-api:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
              infrastructure/kubernetes/services/p2p-backend/deployment.yaml | kubectl apply -f -
          else
            echo "Found deployment in namespace: $NAMESPACE"
            # Update existing deployment
            kubectl set image deployment/p2p-backend \
              p2p-backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              -n $NAMESPACE
          fi

          # Wait for rollout to complete
          kubectl rollout status deployment/p2p-backend -n $NAMESPACE --timeout=300s

          echo "EKS deployment complete!"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, deploy-ecs, deploy-eks]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "==================================="
          echo "Deployment to Dollor.ai Complete!"
          echo "==================================="
          echo ""
          echo "Frontend: https://d3pus2gxlb5cer.cloudfront.net"
          echo "Backend API: http://${{ env.EC2_HOST }}:3000"
          echo ""
          echo "Production URLs:"
          echo "  Frontend: https://dollor.ai"
          echo "  API: https://api.dollor.ai"
          echo ""
          echo "Pages deployed:"
          echo "  - Landing Page: https://dollor.ai/"
          echo "  - Vendor Login: https://dollor.ai/vendor/login"
          echo "  - Driver Login: https://dollor.ai/driver/login"
          echo "  - Restaurant Application: https://dollor.ai/restaurant/apply"
          echo "  - Driver Application: https://dollor.ai/driver/apply"
          echo "  - Terms of Service: https://dollor.ai/terms"
          echo "  - Privacy Policy: https://dollor.ai/privacy"
