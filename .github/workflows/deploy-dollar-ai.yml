name: Deploy to Dollor.ai

on:
  push:
    branches:
      - main
      - feature/dollar-ai-deployment
    paths:
      - 'apps/web/p2p-platform/**'
      - '.github/workflows/deploy-dollar-ai.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: dollar-ai-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E1TL8YTTU1SF3A
  ECR_REPOSITORY: dollor-api
  ECS_CLUSTER: dollor-production
  ECS_SERVICE: dollor-api-service

jobs:
  deploy-frontend:
    name: Deploy Frontend to CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/p2p-platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/p2p-platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/web/p2p-platform/frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.dollor.ai
          VITE_APP_NAME: Dollor.ai
          VITE_ENVIRONMENT: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: apps/web/p2p-platform/frontend
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-ecs:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: apps/web/p2p-platform/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/ecs/task-definition.json
          container-name: dollor-api
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-eks:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: deploy-ecs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name dollor-staging

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Find the namespace where p2p-backend deployment exists
          echo "Looking for p2p-backend deployment..."
          NAMESPACE=$(kubectl get deployments --all-namespaces -o json | jq -r '.items[] | select(.metadata.name=="p2p-backend") | .metadata.namespace' | head -1)

          if [ -z "$NAMESPACE" ] || [ "$NAMESPACE" == "null" ]; then
            echo "Deployment not found, creating in default namespace..."
            NAMESPACE="default"
            # Apply the K8s manifest with updated image tag
            sed "s|134607809447.dkr.ecr.us-east-1.amazonaws.com/dollor-api:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
              infrastructure/kubernetes/services/p2p-backend/deployment.yaml | kubectl apply -f -
          else
            echo "Found deployment in namespace: $NAMESPACE"
            # Update existing deployment
            kubectl set image deployment/p2p-backend \
              p2p-backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              -n $NAMESPACE
          fi

          # Wait for rollout to complete
          kubectl rollout status deployment/p2p-backend -n $NAMESPACE --timeout=300s

          echo "EKS deployment complete!"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-ecs, deploy-eks]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "==================================="
          echo "Deployment to Dollor.ai Complete!"
          echo "==================================="
          echo ""
          echo "Production URLs:"
          echo "  Frontend: https://dollor.ai"
          echo "  API: https://api.dollor.ai"
          echo ""
          echo "Deployment Targets:"
          echo "  - Frontend: CloudFront (S3)"
          echo "  - Backend: ECS Fargate (Production)"
          echo "  - Backend: EKS (Staging)"
          echo ""
          echo "Pages deployed:"
          echo "  - Landing Page: https://dollor.ai/"
          echo "  - Vendor Login: https://dollor.ai/vendor/login"
          echo "  - Driver Login: https://dollor.ai/driver/login"
          echo "  - Restaurant Application: https://dollor.ai/restaurant/apply"
          echo "  - Driver Application: https://dollor.ai/driver/apply"
          echo "  - Terms of Service: https://dollor.ai/terms"
          echo "  - Privacy Policy: https://dollor.ai/privacy"
