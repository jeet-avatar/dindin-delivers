name: Deploy Zietra Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/zietra/**'
      - '.github/workflows/deploy-zietra-marketing.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: zietra-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: zietra-marketing
      DIST_ID: E1X82T89JWL8CA
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/zietra/package-lock.json

      - name: Install deps
        working-directory: apps/zietra
        run: npm ci

      - name: Build
        working-directory: apps/zietra
        run: npm run build

      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::134607809447:role/github-actions-zietra-deploy

      - name: Sync hashed assets (1y immutable)
        working-directory: apps/zietra
        run: |
          aws s3 sync dist/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"

      - name: Upload index.html (no-cache)
        working-directory: apps/zietra
        run: |
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/" "/index.html"
