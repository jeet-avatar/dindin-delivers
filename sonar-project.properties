# SonarCloud Configuration for Dollor.ai Backend
# https://sonarcloud.io

# Project identification
sonar.projectKey=eatfair-backend
sonar.organization=eatfair
sonar.projectName=Dollor.ai Backend API

# Project version (optional, can be set dynamically)
# sonar.projectVersion=1.0

# Source configuration
sonar.sources=apps/web/p2p-platform/backend
sonar.tests=apps/web/p2p-platform/backend/tests
sonar.python.version=3.11

# Exclusions
sonar.exclusions=\
  **/tests/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/migrations/**,\
  **/static/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py

# Coverage
sonar.python.coverage.reportPaths=apps/web/p2p-platform/backend/coverage.xml
sonar.coverage.exclusions=\
  **/tests/**,\
  **/__pycache__/**,\
  **/migrations/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Duplicate detection
sonar.cpd.exclusions=\
  **/tests/**,\
  **/migrations/**

# Security Hotspots
sonar.security.hotspots.threshold=80

# Issue tracking
sonar.links.homepage=https://dollor.ai
sonar.links.ci=https://github.com/your-org/eatfair-ios/actions
sonar.links.scm=https://github.com/your-org/eatfair-ios
sonar.links.issue=https://github.com/your-org/eatfair-ios/issues
