<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <!-- Glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="564" y="72" width="72" height="72" rx="18" fill="#8b5cf6"/>
  <text x="600" y="125" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">B</text>

  <!-- Headline line 1 -->
  <text x="600" y="238" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">The AI that builds music</text>
  <!-- Headline line 2 (accent) -->
  <text x="600" y="318" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#8b5cf6" text-anchor="middle" letter-spacing="-2">inside Ableton.</text>

  <!-- Subtitle -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Describe what you want. Drums, bass, pads, mix — generated in seconds.</text>

  <!-- Badge 1 -->
  <rect x="222" y="430" width="210" height="38" rx="19" fill="#111113" stroke="#2a2a2e" stroke-width="1"/>
  <text x="327" y="454" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">Powered by Claude AI</text>

  <!-- Badge 2 -->
  <rect x="452" y="430" width="130" height="38" rx="19" fill="#111113" stroke="#2a2a2e" stroke-width="1"/>
  <text x="517" y="454" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">AbletonOSC</text>

  <!-- Badge 3 -->
  <rect x="602" y="430" width="272" height="38" rx="19" fill="#111113" stroke="#2a2a2e" stroke-width="1"/>
  <text x="738" y="454" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">$19/month · 7-day free trial</text>

  <!-- URL -->
  <text x="1160" y="602" font-family="Arial, sans-serif" font-size="16" fill="#555555" text-anchor="end">beatmind.io</text>
