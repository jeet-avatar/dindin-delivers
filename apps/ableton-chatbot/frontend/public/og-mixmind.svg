  <rect x="198" y="430" width="228" height="38" rx="19" fill="#111113" stroke="#2a2a2e" stroke-width="1"/>
  <text x="312" y="454" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">Reads Rekordbox 6 &amp; 7</text>

  <!-- Badge 2 -->
