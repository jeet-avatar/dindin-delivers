<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <!-- Glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (outlined style for MixMind) -->
  <rect x="564" y="72" width="72" height="72" rx="18" fill="#111113" stroke="#2a2a2e" stroke-width="2"/>
  <text x="600" y="125" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#8b5cf6" text-anchor="middle">M</text>

  <!-- Headline line 1 -->
  <text x="600" y="238" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">Your DJ library,</text>
  <!-- Headline line 2 (accent) -->
  <text x="600" y="318" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#8b5cf6" text-anchor="middle" letter-spacing="-2">finally organized.</text>

  <!-- Subtitle -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Browse Rekordbox, kill duplicates, build AI playlists. Mac + Windows.</text>

