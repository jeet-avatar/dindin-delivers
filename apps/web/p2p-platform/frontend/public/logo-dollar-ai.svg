<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dollar Sign Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#dollarGrad)" />

  <!-- Dollar Sign $ -->
  <text x="30" y="42" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">$</text>

  <!-- AI Text -->
  <text x="75" y="42" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="url(#aiGrad)">ai</text>

  <!-- Decorative dot -->
  <circle cx="120" cy="38" r="4" fill="#8B5CF6" />
</svg>
