# docker-compose.prod.yml -- Production override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes from base:
# - nginx: mounts nginx.prod.conf (TLS 1.2/1.3, HTTPS redirect, HSTS, security headers)
# - nginx: requires SSL_CERT_PATH and SSL_KEY_PATH environment variables
#   pointing to the customer's SSL certificate and private key on the host.
#
# Required environment variables (set in .env or shell before running):
#   SSL_CERT_PATH=/path/to/fullchain.pem
#   SSL_KEY_PATH=/path/to/privkey.pem
#
# Example:
#   SSL_CERT_PATH=/etc/letsencrypt/live/yourdomain.com/fullchain.pem \
#   SSL_KEY_PATH=/etc/letsencrypt/live/yourdomain.com/privkey.pem \
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.8'

services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/frontend/dist:/usr/share/nginx/html:ro
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/cert.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/key.pem:ro
    environment:
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
