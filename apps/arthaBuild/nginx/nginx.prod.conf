# nginx.prod.conf -- Production-only config
# Used in production deployments. Dev uses nginx.conf (port 80 only).
# Reference: docs/security/DEPLOYMENT_SECURITY.md

# Redirect all HTTP to HTTPS (CASE-188)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # TLS certificates -- customer provides these at deploy time
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # TLS hardening -- Mozilla Intermediate profile (CASE-195)
    # Disables SSLv3, TLSv1.0, TLSv1.1 (RFC 8996 deprecated)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers -- applied to ALL responses (CASE-189)
    # "always" ensures headers are sent on error responses too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP in report-only mode for v1.0 -- logs violations, does not block React app
    # Post-launch: tighten to enforcing mode after reviewing violation reports
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy -> FastAPI backend (120s timeout for AI responses)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8000;
    }

    # React SPA -- all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
