gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/x-javascript application/json
    application/xml application/rss+xml
    image/svg+xml font/woff2;

# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name artha.build www.artha.build staging.artha.build;
    return 301 https://$host$request_uri;
}

# Production — artha.build
server {
    listen 443 ssl;
    http2 on;
    server_name artha.build www.artha.build;

    # Let's Encrypt — auto-renewed by certbot on host, bind-mounted /etc/letsencrypt
    ssl_certificate     /etc/letsencrypt/live/artha.build/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artha.build/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: nginx add_header is NOT inherited into a location block that defines
    # its own add_header. Including the snippet in every location below is the
    # only way to guarantee the 6 security headers ship on every response.
    # DO NOT re-add them here at server level (redundant when every location includes).

    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# Staging — staging.artha.build (same app, same backend, same data for now)
