  <body class="bg-chatbg text-slate-100">
    <div id="root">
      <!-- Inline loading splash — visible instantly, React removes it on mount -->
      <div id="app-loading" style="
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:#15181c;gap:16px;
      ">
        <img src="/android-chrome-192x192.png" width="52" height="52"
             style="border-radius:12px;box-shadow:0 4px 24px rgba(99,102,241,.3);" alt="ArthaBuild" />
        <span style="color:#fff;font-family:system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px;">
          ArthaBuild
        </span>
        <div style="
          width:32px;height:3px;border-radius:4px;background:#1e293b;overflow:hidden;margin-top:4px;
        ">
          <div style="
            height:100%;width:40%;background:#6366f1;border-radius:4px;
            animation:ab-slide 1.2s ease-in-out infinite;
          "></div>
        </div>
        <style>
          @keyframes ab-slide{0%{transform:translateX(-100%)}60%{transform:translateX(200%)}100%{transform:translateX(200%)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
