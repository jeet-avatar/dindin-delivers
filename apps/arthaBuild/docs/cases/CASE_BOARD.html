<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArthaBuild Case Board</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base: #0d0d1a;
    --bg-deep: #1a1a2e;
    --bg-panel: #16213e;
    --bg-card: #0f3460;
    --bg-card-hover: #1a4a7a;
    --bg-input: #1e2a4a;
    --accent: #00d4ff;
    --accent-dim: #0099bb;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #2d3f5e;
    --border-light: #3d5070;

    --sev-critical: #dc2626;
    --sev-high: #ea580c;
    --sev-medium: #d97706;
    --sev-low: #2563eb;
    --sev-info: #6b7280;

    --cat-hardcoded: #f59e0b;
    --cat-dead-code: #8b5cf6;
    --cat-api: #06b6d4;
    --cat-test-gap: #10b981;
    --cat-arch: #ef4444;
    --cat-phase: #f97316;
    --cat-feature-pass: #22c55e;
    --cat-feature-pending: #6b7280;
    --cat-feature-fail: #ef4444;

    --col-pending-bg: #2a2a3e;
    --col-pass-bg: #0d2b1e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  .header-title span {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 14px;
    margin-left: 6px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-card-hover); border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* ── Filter Bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .filter-bar input[type="text"],
  .filter-bar select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-bar input[type="text"] { width: 160px; }
  .filter-bar select { cursor: pointer; }
  .filter-bar input[type="text"]:focus,
  .filter-bar select:focus { border-color: var(--accent); }
  .filter-bar input[type="text"]::placeholder { color: var(--text-muted); }

  /* ── Stats Bar ── */
  .stats-bar {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 5px 16px;
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .stats-bar strong { color: var(--text-primary); }

  /* ── Main Layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Kanban ── */
  .kanban-wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .kanban-board {
    display: flex;
    gap: 12px;
    padding: 12px;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .kanban-col {
    display: flex;
    flex-direction: column;
    min-width: 240px;
    flex: 1;
    max-width: 320px;
    background: var(--bg-panel);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .col-header {
    padding: 10px 12px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .col-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .col-count {
    background: var(--bg-input);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .col-cards {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .col-cards::-webkit-scrollbar { width: 4px; }
  .col-cards::-webkit-scrollbar-track { background: transparent; }
  .col-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-col {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    padding: 24px 8px;
    font-style: italic;
  }

  /* ── Case Card ── */
  .case-card {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    border-left: 3px solid transparent;
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    transition: all 0.15s;
    position: relative;
  }
  .case-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
  .case-card.selected { outline: 2px solid var(--accent); }

  .card-id {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .lock-icon { font-size: 11px; color: #ef4444; }
  .card-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 7px;
  }
  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge-sev-CRITICAL { background: var(--sev-critical); color: #fff; }
  .badge-sev-HIGH { background: var(--sev-high); color: #fff; }
  .badge-sev-MEDIUM { background: var(--sev-medium); color: #000; }
  .badge-sev-LOW { background: var(--sev-low); color: #fff; }
  .badge-sev-INFO { background: var(--sev-info); color: #fff; }
  .badge-phase { background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border); }
  .badge-cat { background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 400; }

  /* Category border colors */
  .cat-HARDCODED { border-left-color: var(--cat-hardcoded) !important; }
  .cat-DEAD_CODE { border-left-color: var(--cat-dead-code) !important; }
  .cat-API_CORRECTNESS { border-left-color: var(--cat-api) !important; }
  .cat-TEST_GAP { border-left-color: var(--cat-test-gap) !important; }
  .cat-ARCH_VIOLATION { border-left-color: var(--cat-arch) !important; }
  .cat-PHASE_CORRECTNESS { border-left-color: var(--cat-phase) !important; }

  /* FEATURE_TEST: border color depends on status (applied via JS class) */
  .cat-FEATURE_TEST.ft-PASS    { border-left-color: var(--cat-feature-pass) !important; }
  .cat-FEATURE_TEST.ft-PENDING { border-left-color: var(--cat-feature-pending) !important; }
  .cat-FEATURE_TEST.ft-FAIL    { border-left-color: var(--cat-feature-fail) !important; }

  /* FAIL cases in OPEN column: red left border override */
  .case-card.status-FAIL { border-left-color: #dc2626 !important; }

  /* ── Detail Panel ── */
  .detail-panel {
    width: 0;
    min-width: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease, min-width 0.25s ease;
    flex-shrink: 0;
  }
  .detail-panel.open {
    width: 480px;
    min-width: 380px;
  }
  .detail-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    min-width: 380px;
  }
  .detail-header {
    background: var(--bg-deep);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-shrink: 0;
  }
  .detail-id {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .detail-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    flex: 1;
  }
  .detail-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .detail-close:hover { color: var(--text-primary); }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }
  .detail-body::-webkit-scrollbar { width: 4px; }
  .detail-body::-webkit-scrollbar-track { background: transparent; }
  .detail-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .meta-field { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); }
  .meta-value { font-size: 12px; color: var(--text-primary); }

  .detail-select, .detail-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .detail-select:focus, .detail-input:focus { border-color: var(--accent); }

  .detail-files {
    margin-bottom: 12px;
  }
  .detail-files-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .file-item {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent-dim);
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }
  .file-item:last-child { border-bottom: none; }
  .file-lines { color: var(--text-muted); }

  .detail-deps {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dep-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dep-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
  .dep-link {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .dep-link:hover { color: #fff; }

  .sections-area { margin-top: 4px; }
  .section-block { margin-bottom: 12px; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 6px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--border);
  }
  .section-content {
    font-size: 12px;
    color: var(--text-primary);
    line-height: 1.6;
  }
  .section-content p { margin-bottom: 6px; }
  .section-content ul { padding-left: 16px; margin-bottom: 6px; }
  .section-content li { margin-bottom: 3px; }
  .section-content code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    background: var(--bg-deep);
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--accent);
  }
  .section-content pre {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    overflow-x: auto;
    margin-bottom: 8px;
  }
  .section-content pre code {
    background: none;
    padding: 0;
    font-size: 11px;
    color: #a5d6a7;
  }
  .section-content strong { color: #f0e68c; font-weight: 600; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* ── FEATURE_TEST detail fields ── */
  .feature-test-fields {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ft-field-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ft-field-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }
  .ft-field-value {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent-dim);
    word-break: break-all;
  }
  .ft-run-hint {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: #a5d6a7;
    margin-top: 4px;
    word-break: break-all;
  }

  /* ── Comments ── */
  .comments-area { margin-top: 4px; }
  .comments-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
  .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .comment-item {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }
  .comment-ts { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .comment-text { font-size: 12px; color: var(--text-primary); line-height: 1.5; }
  .comment-add {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .comment-textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    resize: vertical;
    min-height: 60px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .comment-textarea:focus { border-color: var(--accent); }
  .comment-submit {
    align-self: flex-end;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .comment-submit:hover { background: #00bbdd; }

  /* ── Graph View ── */
  .graph-wrap {
    flex: 1;
    overflow: auto;
    display: none;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 12px;
  }
  .graph-wrap.active { display: flex; }
  #graphSvg {
    background: var(--bg-panel);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  /* ── Notification ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #000;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 9999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Column indicator lines ── */
  .col-PENDING { background: var(--col-pending-bg) !important; }
  .col-PENDING .col-title { color: #9ca3af; }
  .col-OPEN .col-title { color: #60a5fa; }
  .col-IN_PROGRESS .col-title { color: #f59e0b; }
  .col-FIXED .col-title { color: #10b981; }
  .col-VERIFIED .col-title { color: #a78bfa; }
  .col-PASS { background: var(--col-pass-bg) !important; }
  .col-PASS .col-title { color: #22c55e; }
  .col-DONE { background: #0f1e14 !important; }
  .col-DONE .col-title { color: #4ade80; }
  .col-DEFERRED { background: #1a1a2e !important; }
  .col-DEFERRED .col-title { color: #818cf8; }

  /* ── Scrollbar global ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="header-title">ArthaBuild Case Board <span>Case Ticket System</span></div>
    <div class="header-actions">
      <button class="btn active" id="btnKanban" onclick="switchView('kanban')">Kanban Board</button>
      <button class="btn" id="btnGraph" onclick="switchView('graph')">Dep Graph</button>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" id="fSearch" placeholder="Search ID or title..." oninput="applyFilters()">
    <select id="fPhase" onchange="applyFilters()">
      <option value="">Phase: All</option>
      <option value="01">Phase 01</option>
      <option value="02">Phase 02</option>
      <option value="03">Phase 03</option>
      <option value="04">Phase 04</option>
      <option value="05">Phase 05</option>
      <option value="06">Phase 06</option>
      <option value="07">Phase 07</option>
      <option value="07.1">Phase 07.1</option>
      <option value="09">Phase 09</option>
    </select>
    <select id="fSeverity" onchange="applyFilters()">
      <option value="">Severity: All</option>
      <option value="CRITICAL">CRITICAL</option>
      <option value="HIGH">HIGH</option>
      <option value="MEDIUM">MEDIUM</option>
      <option value="LOW">LOW</option>
      <option value="INFO">INFO</option>
    </select>
    <select id="fCategory" onchange="applyFilters()">
      <option value="">Category: All</option>
      <option value="HARDCODED">HARDCODED</option>
      <option value="DEAD_CODE">DEAD_CODE</option>
      <option value="API_CORRECTNESS">API_CORRECTNESS</option>
      <option value="TEST_GAP">TEST_GAP</option>
      <option value="ARCH_VIOLATION">ARCH_VIOLATION</option>
      <option value="PHASE_CORRECTNESS">PHASE_CORRECTNESS</option>
      <option value="FEATURE_TEST">FEATURE_TEST</option>
    </select>
    <select id="fStatus" onchange="applyFilters()">
      <option value="">Status: All</option>
      <option value="OPEN">OPEN</option>
      <option value="IN_PROGRESS">IN_PROGRESS</option>
      <option value="FIXED">FIXED</option>
      <option value="VERIFIED">VERIFIED</option>
      <option value="WONT_FIX">WONT_FIX</option>
      <option value="PENDING">PENDING</option>
      <option value="PASS">PASS</option>
      <option value="FAIL">FAIL</option>
    </select>
    <select id="fAssignee" onchange="applyFilters()">
      <option value="">Assignee: All</option>
      <option value="__unassigned__">Unassigned</option>
    </select>
  </div>
</div>

<!-- Stats Bar -->
<div class="stats-bar" id="statsBar">
  Total: 0 | Open: 0 | In Progress: 0 | Fixed: 0 | Verified: 0 | Won't Fix: 0
</div>

<!-- Main Content -->
<div class="main">
  <!-- Kanban + Graph Container -->
  <div class="kanban-wrap" id="kanbanWrap">
    <!-- Kanban Board -->
    <div class="kanban-board" id="kanbanBoard">
      <div class="kanban-col col-PENDING" id="col-PENDING">
        <div class="col-header"><span class="col-title">Pending</span><span class="col-count" id="cnt-PENDING">0</span></div>
        <div class="col-cards" id="cards-PENDING"></div>
      </div>
      <div class="kanban-col col-OPEN" id="col-OPEN">
        <div class="col-header"><span class="col-title">Open</span><span class="col-count" id="cnt-OPEN">0</span></div>
        <div class="col-cards" id="cards-OPEN"></div>
      </div>
      <div class="kanban-col col-IN_PROGRESS" id="col-IN_PROGRESS">
        <div class="col-header"><span class="col-title">In Progress</span><span class="col-count" id="cnt-IN_PROGRESS">0</span></div>
        <div class="col-cards" id="cards-IN_PROGRESS"></div>
      </div>
      <div class="kanban-col col-FIXED" id="col-FIXED">
        <div class="col-header"><span class="col-title">Fixed</span><span class="col-count" id="cnt-FIXED">0</span></div>
        <div class="col-cards" id="cards-FIXED"></div>
      </div>
      <div class="kanban-col col-VERIFIED" id="col-VERIFIED">

      "What Is Wrong": "`src/backend/models.py` line 40 — the `email` column has no collation:\n```python\nemail = Column(String, unique=True, index=True, nullable=False)\n# Missing: COLLATE NOCASE on the index\n```\n\n`src/backend/routers/auth.py` lines 31 and 46 — normalization is enforced only in code:\n```python\n# check-user (line 31)\nresult = await db.execute(select(User).where(User.email == data.email.lower()))\n\n# login (line 46)\nresult = await db.execute(select(User).where(User.email == data.username.lower()))\n```\n\nThe application correctly calls `.lower()` before every query, so in practice all emails are stored and queried lowercase. However, the `unique=True` constraint on the `email` column does not enforce case-insensitive uniqueness at the database level. SQLite's default string comparison is case-sensitive (`'Alice' != 'alice'`). A direct DB INSERT (via Alembic data migration, admin script, or test fixture that bypasses the application layer) could insert `Alice@test.com` even when `alice@test.com` already exists, breaking the uniqueness invariant.\n\nAdditionally, the `index=True` on the `email` column creates a B-tree index using SQLite's default case-sensitive collation. A query for `Alice@test.com` would not use the index to find `alice@test.com`, though in practice this is masked by the `.lower()` normalization.",
      "Why It Was Done This Way (Root Cause)": "The code-level `.lower()` normalization was applied correctly and consistently in Phase 1. The COLLATE NOCASE constraint was not added because SQLite's default string comparisons are case-sensitive and the normalization appeared to fully solve the problem. The gap only becomes visible when code outside the application layer (direct SQL, migrations, admin tools) touches the email column.",
      "What Is Done Right": "Every application-layer query (check-user, login, forgot-password, register) correctly normalizes email to lowercase before comparison. Registration also stores emails lowercase. This means the bug has zero impact under normal application usage.",
      "How To Fix It": "Add `COLLATE NOCASE` to the email column definition in `models.py` and create an Alembic migration:\n\n**Step 1 — Update model (`src/backend/models.py` line 40):**\n```python\nfrom sqlalchemy import Column, Integer, String, Boolean, DateTime, ForeignKey, func\n# SQLite: use String with collation argument\nemail = Column(String(collation=\"NOCASE\"), unique=True, index=True, nullable=False)\n```\n\n**Step 2 — Generate Alembic migration:**\n```bash\ncd src/backend\nalembic revision --autogenerate -m \"add_nocase_collation_to_email\"\n```\n\n**Step 3 — Review the generated migration** and ensure it uses `batch_alter_table` (required for SQLite ALTER TABLE — CLAUDE.md rule: `render_as_batch=True`).\n\n**Step 4 — Apply migration:**\n```bash\nalembic upgrade head\n```",

      "How To Fix It": "Add the following tests to `src/backend/tests/test_auth.py`:\n\n```python\n@pytest.mark.asyncio\nasync def test_login_success_resets_failed_attempts(client, db_session):\n    \"\"\"\n    TC-AUTH-12b: Successful login after failed attempts resets the counter to 0.\n\n    Architecture: login() sets user.failed_attempts=0, user.locked_until=None on success.\n    Verifies the reset is committed to DB — not just an in-memory change.\n    \"\"\"\n    reset_email = \"lockout-reset@arthaBuild-test.com\"\n    reset_pw = \"LockReset1!\"\n    # Register\n    await client.post(\"/api/user/register\", json={\n        \"first_name\": \"Lock\", \"last_name\": \"Reset\",\n        \"email\": reset_email, \"password\": reset_pw, \"organization\": \"Org\",\n    })\n    # 3 wrong attempts\n    for _ in range(3):\n        await client.post(\"/api/auth/login\", json={\n            \"username\": reset_email, \"password\": \"WrongPass99!\",\n        })\n    # Successful login\n    resp = await client.post(\"/api/auth/login\", json={\n        \"username\": reset_email, \"password\": reset_pw,\n    })\n    assert resp.status_code == 200\n\n    # Check DB: failed_attempts must be 0\n    import sqlalchemy\n    db_session.expire_all()\n    result = await db_session.execute(\n        sqlalchemy.select(User).where(User.email == reset_email.lower())\n    )\n    user = result.scalar_one_or_none()\n    assert user is not None\n    assert user.failed_attempts == 0, f\"Expected 0, got {user.failed_attempts}\"\n    assert user.locked_until is None, f\"Expected None, got {user.locked_until}\"\n```\n\nRun the new test:\n```bash\npytest tests/test_auth.py::test_login_success_resets_failed_attempts -v\n```",

      "How To Fix It": "Add a secondary test or fixture that runs Alembic migrations against the test database to verify migration scripts are correct. This can coexist with the existing `create_all` approach.\n\n**Option A — Add a dedicated migration smoke-test** (minimal change):\n```python\n# In tests/test_migrations.py (new file)\nimport pytest\nimport subprocess\nimport os\n\ndef test_alembic_upgrade_head_succeeds():\n    \"\"\"\n    TC-MIGRATION-01: Alembic upgrade head runs without error against a fresh DB.\n    Uses a temporary SQLite file so it does not touch arthaBuild.db.\n    \"\"\"\n    import tempfile\n    with tempfile.NamedTemporaryFile(suffix=\".db\", delete=False) as f:\n        test_db_path = f.name\n\n    env = {**os.environ, \"DATABASE_URL\": f\"sqlite+aiosqlite:///{test_db_path}\"}\n    result = subprocess.run(\n        [\"alembic\", \"upgrade\", \"head\"],\n        cwd=os.path.dirname(os.path.dirname(__file__)),  # src/backend/\n        capture_output=True,\n        text=True,\n        env=env,\n    )\n    assert result.returncode == 0, f\"Alembic migration failed:\\n{result.stderr}\"\n```\n\n**Option B — Programmatic Alembic invocation** in conftest:\nReplace `Base.metadata.create_all` with `alembic upgrade head` using `alembic.config.Config` and `alembic.command.upgrade`. This is the most faithful test of production behavior but requires more setup.\n\nRun the migration smoke-test:\n```bash\npytest tests/test_migrations.py -v\n```",

    "sections": {
      "Why This Case Was Created": "Triggered by the ARCH_VIOLATION audit dimension. CLAUDE.md states that TBA credentials \"live ONLY in `session_store.py` Python dict in RAM\" — this is correct and is the right architectural decision. However, the credentials are stored as plaintext Python strings, which means any process memory dump, core dump, or memory debugging tool that has access to the Python heap can read the credentials in plaintext. The architectural rule says RAM only (correct) but does not address in-memory encryption, which is an additional hardening layer.",
      "What Is Wrong": "`src/backend/session_store.py` lines 13–24 define the `NetSuiteCreds` dataclass with all sensitive fields as plain Python `str`:\n\n```python\n@dataclass\nclass NetSuiteCreds:\n    account_id: str           # plaintext in RAM\n    token_key: str            # plaintext in RAM  ← TBA access token\n    token_secret: str         # plaintext in RAM  ← TBA token secret\n    consumer_key: str         # plaintext in RAM  ← OAuth consumer key\n    consumer_secret: str      # plaintext in RAM  ← OAuth consumer secret\n    authenticated_at: datetime\n    account_name: Optional[str] = None\n```\n\nAnd the store itself is a plain dict (line 24):\n```python\n_store: dict[int, NetSuiteCreds] = {}\n```\n\nThe five string fields (`token_key`, `token_secret`, `consumer_key`, `consumer_secret`, plus `account_id`) are stored as Python `str` objects. Python strings are immutable objects managed by the interpreter's memory allocator. They are not pinned to memory — the garbage collector can move them between heap locations, potentially leaving copies in freed memory. A process memory dump (via `/proc/PID/mem`, Python's `tracemalloc`, or a Docker container checkpoint) would reveal the credentials in plaintext.\n\nThe architectural decision to keep credentials RAM-only (not disk, not DB, not env) is correct and effectively protects against the most common persistence-based attacks. The in-memory plaintext representation is a secondary risk that applies to memory forensics scenarios.",
      "Why It Was Done This Way (Root Cause)": "Storing credentials as plain strings is the standard Python approach and is appropriate for most applications. The RAM-only storage rule was implemented correctly. In-memory encryption (e.g., using `cryptography` library's `Fernet` with an ephemeral key) was not implemented because it adds complexity and the threat model may not require it for the target deployment (single-tenant BYOC). The current implementation is a reasonable MVP security posture.",
      "What Is Done Right": "- Thread safety: the `threading.Lock()` at line 25 correctly protects concurrent access — `set_session_creds`, `get_session_creds`, and `clear_session_creds` all use `with _lock:`.\n- Keyed by `user_id` (int): credentials are isolated per user — User A cannot access User B's credentials.\n- `clear_session_creds` wipes the entry from the dict on logout, removing the reference so the string objects become eligible for garbage collection.\n- NEVER written to disk, DB, logs, or env vars — the CLAUDE.md invariant is fully upheld.",
      "How To Fix It": "**Option A (minimal — document the risk):** Add a docstring to `session_store.py` documenting the plaintext-in-RAM characteristic and noting it as a known architectural trade-off:\n\n```python\n\"\"\"\nIn-memory NetSuite TBA credential store.\nSECURITY: Credentials NEVER leave server RAM.\n           NEVER write to DB, disk, logs, or env vars.\nKNOWN LIMITATION: Credentials are stored as plaintext Python strings.\n           In a memory forensics scenario (core dump, /proc/mem access),\n           they would be readable. Mitigate with OS-level memory protection\n           (SELinux, seccomp in Docker). In-memory encryption not implemented\n           because it adds key management complexity for a single-tenant deployment.\nKeyed by user_id (int) from JWT sub claim.\n\"\"\"\n```\n\n**Option B (full fix — ephemeral key encryption):**\n\n```python\nimport os\nfrom cryptography.fernet import Fernet\n\n# Ephemeral key — generated fresh on each process start, stored nowhere\n_EPHEMERAL_KEY = Fernet.generate_key()\n_fernet = Fernet(_EPHEMERAL_KEY)\n\n@dataclass\nclass NetSuiteCreds:\n    _token_key_enc: bytes       # encrypted bytes, not plain str\n    _token_secret_enc: bytes\n    _consumer_key_enc: bytes\n    _consumer_secret_enc: bytes\n    account_id: str             # non-secret, can remain plaintext\n    authenticated_at: datetime\n    account_name: Optional[str] = None\n\n    def get_token_key(self) -> str:\n        return _fernet.decrypt(self._token_key_enc).decode()\n    # ... etc.\n```\n\nOption A is the recommended first step for documentation clarity. Option B requires adding `cryptography` to `requirements.txt` and restructuring `NetSuiteCreds`.",
      "Architecture Mapping": "\n**Layer:** Backend Security — In-Memory Credential Store\n\n**Flow:**\n\n    POST /api/netsuite/authenticate\n      → _validate_tba_credentials(account_id, token_key, ...)\n        → set_session_creds(user_id, NetSuiteCreds(token_key=\"plaintext\", ...))\n                                               ↑\n                                      THIS CASE LIVES HERE (plaintext in RAM)\n          → _store[user_id] = creds (dict in process heap)\n\n    GET /api/netsuite/status\n      → get_session_creds(user_id)\n        → returns NetSuiteCreds with plaintext fields accessible\n\n**Upstream:** `routers/netsuite.py` authenticate route calls `set_session_creds`\n\n**Downstream:** `routers/netsuite.py`, `routers/deploy.py` call `get_session_creds` to retrieve credentials for NetSuite API calls",
      "Verification": "- [ ] Grep proof: `grep -n \"str\\|bytes\" src/backend/session_store.py` → shows all fields as `str` (plaintext)\n- [ ] Grep proof: `grep -rn \"encrypt\\|Fernet\\|cryptography\" src/backend/session_store.py` → empty (confirms no encryption)\n- [ ] Documentation fix proof: `grep -n \"KNOWN LIMITATION\\|plaintext\" src/backend/session_store.py` → shows added docstring",
      "Downstream Impact": "**Impact if unfixed:** Security Risk (low probability, high consequence)\n\nIn a standard web server deployment, this is low risk — process memory is protected by the OS. In a containerized environment (Docker), a container escape vulnerability or a misconfigured debug tool could expose the credentials. The primary attack surface (disk storage, logging) is fully protected. The residual risk is memory forensics, which requires significant attacker capability.",

      "What Is Wrong": "`src/backend/sdf_utils.py` lines 52–61 contain a commented-out block with real-looking TBA credential fields inside the `setup_account_ci()` function:\n\n```python\ndef setup_account_ci(project_name=\"TestSDFProject\"):\n    ORIGINAL_DIR, PROJECT_DIR = get_project_dirs(project_name)\n    ...\n    try:\n        os.chdir(PROJECT_DIR)\n        run_command([\n            \"suitecloud\", \"account:setup\",\n            # \"--account\", \"7220160_SB2\",\n            # \"--authid\", \"ci_auth\",\n            # \"--tokenid\", \"f031aaec6baa2f58cb2c03529018bd008ffec525756564fcc897fe9ec1c8c365\",\n            # \"--tokensecret\", \"60d3660c33c61f6a4f50c1fa70d9c2e0d63a4ce2c1354f3113132cf3fc40b36e\",\n            # \"--consumerkey\", \"5518df2f82dd6fe7610e5d8f323cb5f42f27a638f86eff897716446cad6f021c\",\n            # \"--consumersecret\", \"69a0483de4e5e4347d0b04d921ddd0a7c38aa0cd90f8550a56c3d9dd7e32294\"\n        ])\n    finally:\n        os.chdir(ORIGINAL_DIR)\n```\n\nThe commented-out values are hexadecimal strings of length 64 (SHA-256 hashes or token values). The account `\"7220160_SB2\"` matches the sandbox account ID used in test fixtures (`test_netsuite.py:46`). While these appear to be development/sandbox credentials, they represent real NetSuite TBA token material from a development account. Leaving them in version control violates the credential handling rules and could confuse developers about the intended authentication flow (credentials should come from `session_store.py`, not hardcoded CLI flags).",

      "Why This Case Was Created": "Triggered by the HARDCODED audit dimension. The model names `llama3.1:8b` and `nomic-embed-text` are specified in multiple places and the startup check in `rawapi.py` validates model availability using substring matching against `any(\"llama3.1\" in m ...)` — which passes for any `llama3.1:*` tag. If a user pulls `llama3.1:70b` instead of `llama3.1:8b`, the startup check succeeds but `model_utils.py` will attempt to use `llama3.1:8b` specifically, causing Ollama to return a 404 at inference time with a cryptic error.",
      "What Is Wrong": "`src/backend/rawapi.py` lines 43–49 — the Ollama availability check uses substring matching:\n```python\nmodels = [m[\"name\"] for m in resp.json().get(\"models\", [])]\nhas_llm = any(\"llama3.1\" in m for m in models)       # matches llama3.1:70b too\nhas_embed = any(\"nomic\" in m for m in models)         # matches nomic-embed-text:v1.5 too\nif not has_llm:\n    _log.warning(\"llama3.1:8b not pulled. Run: ollama pull llama3.1:8b\")\nif not has_embed:\n    _log.warning(\"nomic-embed-text not pulled. Run: ollama pull nomic-embed-text\")\nreturn has_llm and has_embed\n```\n\n`src/backend/model_utils.py` lines 20–21 — the model names used for inference are loaded from env vars with hardcoded defaults:\n```python\nOLLAMA_MODEL = os.getenv(\"OLLAMA_MODEL\", \"llama3.1:8b\")\nOLLAMA_EMBED_MODEL = os.getenv(\"OLLAMA_EMBED_MODEL\", \"nomic-embed-text\")\n```\n\n**The mismatch scenario:**\n1. User runs `ollama pull llama3.1:70b` (large model, different tag)\n2. `_check_ollama_available()` returns `True` (substring \"llama3.1\" is found)\n3. `_ai_ready = True` — server starts normally\n4. User sends a chat message\n5. `ChatOllama(model=\"llama3.1:8b\")` is instantiated\n6. Ollama returns: `{\"error\":\"model 'llama3.1:8b' not found\"}` (the 8b tag was not pulled)\n7. User sees a 500 error or an LLM failure message — no actionable guidance\n\nAdditionally, the `OLLAMA_MODEL` env var override path is not validated — if a user sets `OLLAMA_MODEL=my-custom-model`, there is no startup check confirming that model exists in Ollama.",
      "Why It Was Done This Way (Root Cause)": "The substring matching approach (`any(\"llama3.1\" in m ...)`) was used to be tolerant of minor tag variations (e.g., `llama3.1:8b-instruct-q4_K_M`). The assumption was that any `llama3.1` variant would behave similarly to `llama3.1:8b`. The env var defaults were set once during Phase 3 and not revisited. There is no validation loop that cross-checks which specific tag the user pulled against which tag the code will request.",
      "What Is Done Right": "The `_check_ollama_available()` function in `rawapi.py` (lines 35–52) is a well-designed startup gate — it checks Ollama connectivity AND model availability before setting `_ai_ready = True`. The warning messages (`llama3.1:8b not pulled. Run: ollama pull llama3.1:8b`) are actionable. The env var override mechanism (`OLLAMA_MODEL`, `OLLAMA_EMBED_MODEL`) is the correct pattern for deployment flexibility.",
      "How To Fix It": "**Step 1 — Exact tag matching in `_check_ollama_available()`:**\n\nIn `rawapi.py`, replace substring matching with exact tag comparison using the configured model names:\n\n```python\ndef _check_ollama_available() -> bool:\n    from config import OLLAMA_MODEL, OLLAMA_EMBED_MODEL  # or read env vars directly\n    ollama_url = os.getenv(\"OLLAMA_BASE_URL\", \"http://localhost:11434\")\n    try:\n        resp = _requests.get(f\"{ollama_url}/api/tags\", timeout=5)\n        if resp.status_code != 200:\n            return False\n        models = [m[\"name\"] for m in resp.json().get(\"models\", [])]\n        # Exact match: the configured model tag must exist\n        has_llm = OLLAMA_MODEL in models\n        has_embed = OLLAMA_EMBED_MODEL in models\n        if not has_llm:\n            _log.warning(f\"Model '{OLLAMA_MODEL}' not found in Ollama. Run: ollama pull {OLLAMA_MODEL}\")\n            _log.warning(f\"Available models: {models}\")\n        if not has_embed:\n            _log.warning(f\"Embedding model '{OLLAMA_EMBED_MODEL}' not found. Run: ollama pull {OLLAMA_EMBED_MODEL}\")\n        return has_llm and has_embed\n    except Exception as e:\n        _log.warning(f\"Ollama not available at {ollama_url}: {e}\")\n        return False\n```\n\n**Step 2 — Add model validation to the startup event:**\nIn `startup_validation()`, add a check that prints available models if `_ai_ready` is False after the startup guard.",
      "Architecture Mapping": "\n**Layer:** Backend Application Startup — AI Pipeline Initialization\n\n**Flow:**\n\n    rawapi.py startup:\n      _check_ollama_available()\n        → GET /api/tags (Ollama)\n          → any(\"llama3.1\" in m for m in models)   ← THIS CASE LIVES HERE (substring match)\n             → True if llama3.1:70b exists (but code uses llama3.1:8b)\n        → _ai_ready = True (false positive)\n      model_utils.build_graph()\n        → ChatOllama(model=\"llama3.1:8b\")   ← uses specific tag from env var default\n          → Ollama API: model 'llama3.1:8b' not found → 500 at inference time\n\n**Upstream:** Docker Compose or local developer sets up Ollama and pulls models\n\n**Downstream:** `model_utils.get_llm()` and `model_utils.get_embeddings()` use the exact model tag; if the tag doesn't exist in Ollama, all LLM calls fail",
      "Verification": "- [ ] Grep proof: `grep -n \"any.*llama3.1\\|any.*nomic\" src/backend/rawapi.py` → shows lines 43-44 (substring match)\n- [ ] Grep proof: `grep -n \"OLLAMA_MODEL\\|llama3.1:8b\\|nomic-embed-text\" src/backend/model_utils.py` → shows lines 20-21\n- [ ] Fix proof: after exact matching, test with `ollama pull llama3.1:70b` only → server should log warning and set `_ai_ready=False`",
      "Downstream Impact": "**Impact if unfixed:** Degraded UX — silent failure at inference time\n\nIf a user pulls the wrong model tag, the server starts successfully (`_ai_ready=True`) but all chat requests fail with 500 errors or empty responses. The error message from Ollama (\"model not found\") may be swallowed by the try/except in `rawapi.py:334` and returned as a generic error, providing no guidance to the operator.",

    "sections": {
      "Why This Case Was Created": "Triggered by the ARCH_VIOLATION audit dimension. The `/api/chatbot/process` endpoint is the most computationally expensive route in the application — each request triggers a full Ollama LLM inference cycle (retrieve → grade → rewrite → generate), which can take 3–30 seconds and consumes all available CPU on the host. There is no rate limiting decorator on this endpoint. An authenticated user (or a script using a valid JWT) can flood the endpoint with hundreds of concurrent requests, exhausting CPU, RAM, and Ollama's request queue, causing a Denial of Service for all other users.",
      "What Is Wrong": "`src/backend/rawapi.py` line 237 — the chatbot endpoint has NO `@limiter.limit(...)` decorator:\n\n```python\n# === FastAPI Route ===\n@app.post(\"/api/chatbot/process\")     # ← no @limiter.limit() decorator\nasync def ask(request: Request):\n    async with AsyncSessionLocal() as _lic_db:\n        _lic = await license_module.validate_license(_lic_db)\n    if not _lic.get(\"valid\"):\n        raise HTTPException(status_code=402, ...)\n    if not _ai_ready:\n        return JSONResponse(content={...}, status_code=503)\n    try:\n        data = await request.json()\n        ...\n        result = graph.invoke(input_data)   # ← full Ollama LLM inference, up to 30 seconds\n```\n\nBy contrast, the auth routes in `routers/auth.py` correctly apply rate limiting:\n```python\n@router.post(\"/login\", response_model=TokenResponse)\n@limiter.limit(\"10/minute\")      # ← rate limited\nasync def login(request: Request, ...):\n```\n\nSlowAPI (`from auth_utils import limiter`) is already configured on the app:\n```python\napp.state.limiter = limiter\napp.add_exception_handler(RateLimitExceeded, _rate_limit_exceeded_handler)\n```\n\nThe infrastructure for rate limiting is fully in place. It is simply not applied to the most expensive endpoint.\n\n**Impact scenario:** A single authenticated user sends 50 concurrent POST requests to `/api/chatbot/process`. Ollama queues all 50 requests. The server's CPU reaches 100% for the duration of inference (minutes). Other users experience timeouts. The Ollama process may run out of memory and crash.",
      "Why It Was Done This Way (Root Cause)": "Rate limiting was applied to auth endpoints (login, check-user) during Phase 1 because they are the most common brute-force targets. The chatbot endpoint was added later and the rate limiter decorator was not added, either because the Phase 3 developer assumed the license check provides sufficient access control, or because it was deferred. The license check only gates unauthenticated access — it does not limit request frequency for valid license holders.",
      "What Is Done Right": "- SlowAPI is correctly configured on the FastAPI app instance (`rawapi.py:111-112`)\n- The license check at line 239-242 prevents unauthenticated users from triggering inference\n- The `_ai_ready` check at line 243 prevents inference when Ollama is not available\n- The `limiter` from `auth_utils` uses IP-based rate limiting, which is the correct approach",
      "How To Fix It": "Add a `@limiter.limit()` decorator to the chatbot endpoint and make the endpoint accept `Request` explicitly for SlowAPI:\n\n**In `src/backend/rawapi.py` lines 236-238:**\n```python\n# Before\n@app.post(\"/api/chatbot/process\")\nasync def ask(request: Request):\n\n# After\n@app.post(\"/api/chatbot/process\")\n@limiter.limit(\"10/minute\")      # adjust limit based on LLM inference time\nasync def ask(request: Request):\n```\n\nThe `Request` object is already the first parameter — SlowAPI requires this for rate limiter key extraction.\n\n**Recommended limits (adjust based on Ollama model inference time):**\n- `\"10/minute\"` for development (conservative)\n- `\"30/minute\"` for production with llama3.1:8b on modern hardware\n\n**Step 2 — Verify the rate limiter key uses IP, not user:**\n```bash\ngrep -n \"key_func\\|limiter.*=.*Limiter\" src/backend/auth_utils.py\n```\nIf using `get_ipaddr` as key_func, the limit is per-IP. For ArthaBuild's single-tenant model, per-IP is sufficient. For multi-user deployments, consider per-user-ID limiting.",
      "Architecture Mapping": "\n**Layer:** Backend Router — Rate Limiting Middleware\n\n**Flow:**\n\n    POST /api/chatbot/process\n      → [no rate limit check]   ← THIS CASE LIVES HERE (missing @limiter.limit decorator)\n        → license check (validates license, not frequency)\n          → _ai_ready check\n            → graph.invoke() → Ollama LLM inference (3-30 seconds, 100% CPU)\n\n    [Correct pattern — from auth endpoints]\n    POST /api/auth/login\n      → @limiter.limit(\"10/minute\")   ← rate limit enforced\n        → login logic\n\n**Upstream:** Any authenticated client can send unlimited requests to this endpoint\n\n**Downstream:** `graph.invoke()` in `model_utils.build_graph()` — full RAG pipeline execution; Ollama process CPU/RAM consumption",
      "Verification": "- [ ] Grep proof: `grep -n \"@limiter\\|limiter.limit\" src/backend/rawapi.py` → empty (confirms no rate limit on chatbot endpoint)\n- [ ] Grep proof: `grep -n \"@limiter\" src/backend/routers/auth.py` → shows decorators on login and check-user (confirms limiter is used elsewhere)\n- [ ] Fix proof: after adding `@limiter.limit(\"10/minute\")`, send 11 rapid requests → 11th returns 429\n- [ ] Runtime proof: `curl -X POST http://localhost:8000/api/chatbot/process ... ` (11 times quickly) → 10 succeed, 11th returns `{\"error\": \"Rate limit exceeded\"}`",
      "Downstream Impact": "**Impact if unfixed:** System Failure / DoS vector\n\nAny authenticated user (valid JWT + valid license) can exhaust server resources by flooding this endpoint. Ollama has no built-in concurrency limit for requests — it queues them all, consuming unbounded CPU. In a single-tenant deployment this means the authorized user can accidentally or deliberately lock themselves out of the system. In a multi-user deployment it is a critical DoS vector.",

      "What Is Wrong": "`src/backend/rawapi.py:154-185`:\n```python\nasync def _persist_chat_to_db(\n    chat_session_id: int,\n    user_input: str,\n    response_text: str,\n    intent: str,\n):\n    \"\"\"\n    Non-fatal helper: persist user + assistant messages to DB when chat_session_id is provided.\n    Falls back silently — in-memory context still works even if DB write fails.\n    \"\"\"\n    try:\n        _db_session_factory = _async_sessionmaker(_db_engine, expire_on_commit=False)\n        async with _db_session_factory() as db_sess:\n            db_sess.add(ChatMessage(...))\n            db_sess.add(ChatMessage(...))\n            await db_sess.execute(...)\n            await db_sess.commit()\n    except Exception as _e:\n        logger.warning(f\"Failed to persist chat message to DB (non-fatal): {_e}\")\n        # Returns None — caller never knows\n```\n\nThe caller at `rawapi.py:329-332` does not check the return value:\n```python\nif chat_session_id:\n    await _persist_chat_to_db(chat_session_id, user_input, response_text, intent)\nreturn JSONResponse(content={\"response\": response_text, \"intent\": intent, ...})\n```\n\nIf `db_sess.commit()` fails (DB locked, disk full, migration mismatch), the user receives a 200 response with their AI answer, but neither the user message nor the assistant message is saved to the `chat_messages` table. The user believes their chat history is saved — it is not. The next time they load the session, those messages will be absent.",

      "What Is Wrong": "The endpoint `POST /api/chatbot/process` has six distinct return paths. Tracing each:\n\n**Path 1 — License invalid (`rawapi.py:241-242`):** raises `HTTPException(402)`. No `latency_ms` — acceptable since it's an HTTP exception, not a JSON response.\n\n**Path 2 — AI not ready (`rawapi.py:243-247`):**\n```python\nreturn JSONResponse(\n    content={\"response\": \"AI service not yet configured. Phase 3 wires the LLM.\"},\n    status_code=503,\n)\n```\nMissing: `intent`, `session_id`, `latency_ms`. This is a valid degraded state but returns a different shape than the 200 paths.\n\n**Path 3 — \"yes\" confirm path (`rawapi.py:298-299`):** Returns with `latency_ms`. Correct.\n\n**Path 4 — fetch_netsuite_data path (`rawapi.py:305-306`):** Returns with `latency_ms`. Correct.\n\n**Path 5 — manage_sdf_project path (`rawapi.py:317-318`):** Returns with `latency_ms`. Correct.\n\n**Path 6 — Main LLM path (`rawapi.py:332`):** Returns with `latency_ms`. Correct.\n\n**Path 7 — BaseException catch (`rawapi.py:334-336`):**\n```python\nexcept BaseException as e:\n    print(\"❌ Error in /ask:\", str(e))\n    return JSONResponse(content={\"detail\": str(e)}, status_code=500)\n```\nReturns `{detail: str}` — no `response`, `intent`, `session_id`, `latency_ms`. This is the most divergent from the contract.\n\nFrontend code that does `const { response, latency_ms } = await callChatbot(msg)` will receive `undefined` for both fields on a 503 or 500, potentially rendering `\"undefined ms\"` or crashing if code calls `.length` on `undefined`.",
      "Why It Was Done This Way (Root Cause)": "The `start_time = time.time()` variable is defined inside the `try` block at `rawapi.py:255`. The non-AI-ready path (lines 243-247) is outside the try block and runs before `start_time` is set — so `latency_ms` literally cannot be computed there. The error catch at line 334 could compute `latency_ms` but was written as a minimal error shim.",
      "What Is Done Right": "All four primary intent paths (general LLM, \"yes\" confirm, fetch NetSuite, manage SDF) correctly return the full contract shape including `latency_ms`. The Phase 4 test `test_chatbot_returns_200_with_ollama` verifies the happy path contract. The intent of having `latency_ms` in the response is correct and well-motivated.",
      "How To Fix It": "**Step 1 — Move `start_time` to before the try block and add `latency_ms` to all return paths.**\n\nIn `rawapi.py:248`, move `start_time` assignment to before the non-AI-ready guard:\n\n```python\n@app.post(\"/api/chatbot/process\")\nasync def ask(request: Request):\n    start_time = time.time()   # move here — before AI ready check\n    async with AsyncSessionLocal() as _lic_db:\n        _lic = await license_module.validate_license(_lic_db)\n    if not _lic.get(\"valid\"):\n        raise HTTPException(status_code=402, detail=f\"License required. Contact {license_module.SALES_EMAIL}\")\n    if not _ai_ready:\n        return JSONResponse(\n            content={\n                \"response\": \"AI service not yet configured. Phase 3 wires the LLM.\",\n                \"intent\": \"unavailable\",\n                \"session_id\": \"default\",\n                \"latency_ms\": round((time.time() - start_time) * 1000),\n            },\n            status_code=503,\n        )\n    try:\n        data = await request.json()\n        # start_time already set above — remove the line inside try\n```\n\n**Step 2 — Fix the BaseException catch at `rawapi.py:334-336`:**\n\n```python\nexcept BaseException as e:\n    logger.error(f\"Error in /api/chatbot/process: {e}\")\n    return JSONResponse(content={\n        \"detail\": str(e),\n        \"response\": \"An internal error occurred.\",\n        \"intent\": \"error\",\n        \"session_id\": \"default\",\n        \"latency_ms\": round((time.time() - start_time) * 1000),\n    }, status_code=500)\n```\n\n**Step 3 — Replace `print()` with `logger.error()` in the catch block** (the bare `print` is a separate low-priority issue).",

      "Why This Case Was Created": "CI/CD test coverage audit for infrastructure assets. The test suite in `src/backend/tests/` covers the Python application layer but has no test that validates the Docker build succeeds or that `docker-compose.yml` parses correctly. The `Dockerfile` and `docker-compose.yml` are modified by multiple phases (Phase 5, Phase 6 hardening, Phase 9 adding the new DB schema). A broken `COPY` directive or an invalid Compose service definition would only be caught on the next `docker compose up`, not in CI.",
      "What Is Wrong": "The directory `src/backend/tests/` contains: `conftest.py`, `test_auth.py`, `test_chats.py`, `test_health.py`, `test_netsuite.py`, `test_rbac.py`, `test_security.py`, `test_user.py`. None of these files contain any test that:\n\n1. Validates the `Dockerfile` is syntactically correct and builds successfully\n2. Validates `docker-compose.yml` parses without errors (`docker compose config`)\n3. Validates environment variables required by the Dockerfile are documented in `.env.example`\n\nIf a developer adds a new `COPY` directive referencing a file that doesn't exist, or changes a `RUN` command that breaks the layer cache in a way that fails silently in dev but fails in CI, there is no automated detection.\n\n**Specific risk:** The `Dockerfile` uses a multi-stage build. If the `COPY --from=builder` path changes in the builder stage but not the final stage, `docker build` fails with a file-not-found error that pytest cannot detect.",
      "Why It Was Done This Way (Root Cause)": "pytest is a Python test framework — it does not natively invoke Docker CLI commands. Docker build testing requires shell-level integration (bash scripts or a Makefile target). The Phase 5 plan focused on creating the Dockerfile and Compose file correctly for the first time; adding a CI validation layer for the infrastructure assets themselves was deferred.",
      "What Is Done Right": "The Python test suite is comprehensive at the application layer (auth, chats, RBAC, security, health). The `Dockerfile` correctly uses multi-stage builds and the `docker-compose.yml` uses named volumes for data persistence. The `deploy.sh` script provides a reference deployment sequence.",
      "How To Fix It": "**Step 1 — Create `scripts/validate-docker.sh` in the project root:**\n\n```bash\n#!/usr/bin/env bash\n# validate-docker.sh — CI smoke test for Docker and Compose assets\n# Does NOT build the full image (too slow for CI). Validates syntax and parse.\n\nset -e\n\necho \"=== Validating docker-compose.yml ===\"\ndocker compose config --quiet\necho \"docker-compose.yml: OK\"\n\necho \"=== Checking Dockerfile syntax (hadolint) ===\"\nif command -v hadolint &>/dev/null; then\n    hadolint Dockerfile\n    echo \"Dockerfile: OK (hadolint)\"\nelse\n    echo \"hadolint not installed — skipping lint (install: brew install hadolint)\"\nfi\n\necho \"=== Checking required env vars in .env.example ===\"\nREQUIRED_VARS=(JWT_SECRET_KEY DATABASE_URL FRONTEND_BASE_URL OLLAMA_BASE_URL)\nfor var in \"${REQUIRED_VARS[@]}\"; do\n    if grep -q \"^${var}\" .env.example 2>/dev/null; then\n        echo \".env.example: $var OK\"\n    else\n        echo \"WARNING: $var not documented in .env.example\"\n    fi\ndone\n\necho \"=== All Docker validation checks passed ===\"\n```\n\n**Step 2 — Run `docker compose config` in CI pipeline.**\n\nAdd to `.github/workflows/` (or equivalent CI config):\n```yaml\n- name: Validate Docker Compose\n  run: docker compose config --quiet\n  working-directory: apps/arthaBuild\n```\n\n**Step 3 — Optional: add a `test_docker_compose_valid` pytest test using `subprocess`:**\n\n```python\n# src/backend/tests/test_infrastructure.py\nimport subprocess\nimport os\nimport pytest\n\ndef test_docker_compose_config_valid():\n    \"\"\"docker compose config must parse without errors.\"\"\"\n    project_root = os.path.join(os.path.dirname(__file__), \"..\", \"..\", \"..\", \"..\")\n    result = subprocess.run(\n        [\"docker\", \"compose\", \"config\", \"--quiet\"],\n        capture_output=True,\n        text=True,\n        cwd=project_root,\n    )\n    assert result.returncode == 0, (\n        f\"docker compose config failed:\\n{result.stderr}\"\n    )\n```\n\nNote: This test requires Docker to be installed on the CI runner. Mark it with `@pytest.mark.skipif(not shutil.which(\"docker\"), reason=\"Docker not available\")` for environments without Docker.",
      "Architecture Mapping": "\n**Layer:** Deploy (infrastructure assets)\n\n**Flow:**\n\n    [Developer edits Dockerfile or docker-compose.yml]\n                    ↓\n    [git push → CI runs pytest]\n                    ↓\n    [No Docker tests → CI passes even with broken Dockerfile]\n                    ↓\n    [docker compose up fails in staging]\n                    ↑\n             GAP LIVES HERE — no CI gate on infra assets\n\n**Upstream:** Developer changes to `Dockerfile`, `docker-compose.yml`, `nginx/` config\n**Downstream:** `deploy.sh`, staging environment, production environment",
      "Verification": "- [ ] Grep proof: `grep -rn \"docker\\|compose\\|Dockerfile\" src/backend/tests/` — confirms no existing Docker tests\n- [ ] Test proof: `bash scripts/validate-docker.sh` (after creating the script)\n- [ ] Runtime proof: `docker compose config --quiet` returns exit code 0",
      "Downstream Impact": "**Impact if unfixed:** System Failure (on deploy)\n\nA broken `Dockerfile` or `docker-compose.yml` causes `docker compose up` to fail in staging or production. This is a deployment blocker. Without automated validation, the failure is only discovered at deploy time, not at commit time. Low probability but high blast radius — a broken infrastructure asset blocks all deployments until fixed.",

      "How To Fix It": "Write the following test in `tests/integration/test_volume_persistence.py`:\n\n```python\nimport subprocess\nimport requests\nimport pytest\n\nBASE_URL = \"http://localhost:8000\"\n\n@pytest.mark.integration\ndef test_data_persists_across_compose_restart():\n    \"\"\"\n    Verify SQLite DB and FAISS vectorstore survive docker compose restart.\n    Steps:\n    1. Create a user (writes to SQLite)\n    2. Restart compose\n    3. Verify user still exists (reads from SQLite)\n    \"\"\"\n    # 1. Create a user\n    resp = requests.post(f\"{BASE_URL}/api/auth/register\", json={\n        \"email\": \"persist_test@example.com\",\n        \"password\": \"TestPass123!\",\n        \"first_name\": \"Persist\",\n        \"last_name\": \"Test\",\n    })\n    assert resp.status_code == 201, f\"Registration failed: {resp.text}\"\n\n    # 2. Restart compose\n    result = subprocess.run(\n        [\"docker\", \"compose\", \"restart\", \"backend\"],\n        capture_output=True, text=True, timeout=60\n    )\n    assert result.returncode == 0, f\"Restart failed: {result.stderr}\"\n\n    # Wait for backend to be healthy\n    import time\n    for _ in range(10):\n        try:\n            health = requests.get(f\"{BASE_URL}/api/health\", timeout=3)\n            if health.status_code == 200:\n                break\n        except Exception:\n            pass\n        time.sleep(2)\n\n    # 3. Verify user still exists\n    resp = requests.post(f\"{BASE_URL}/api/auth/check-user\", json={\"email\": \"persist_test@example.com\"})\n    assert resp.status_code == 200, f\"User not found after restart: {resp.text}\"\n    assert resp.json().get(\"exists\") is True\n```",

      "Why This Case Was Created": "Database migration integrity audit. The test suite creates the test database schema using SQLAlchemy's `Base.metadata.create_all()` (`conftest.py:59-60`). This approach bypasses Alembic entirely — it creates the latest schema directly from ORM models without exercising any migration scripts. There are currently 4 Alembic migrations in `src/backend/alembic/versions/`. A broken migration (incorrect `op.add_column`, wrong `batch_alter_table` context for SQLite, or a syntax error in a `.py` migration file) would go undetected by the entire test suite. The production startup event at `rawapi.py:196-206` runs `alembic upgrade head` — if that fails in production, the app logs an error but continues, which can cause DB schema mismatches.",
      "What Is Wrong": "`src/backend/tests/conftest.py:56-63`:\n```python\n@pytest_asyncio.fixture(scope=\"session\", autouse=True)\nasync def create_tables():\n    \"\"\"Create all tables once per test session in the in-memory DB.\"\"\"\n    async with test_engine.begin() as conn:\n        await conn.run_sync(Base.metadata.create_all)   # ← bypasses Alembic\n    yield\n    async with test_engine.begin() as conn:\n        await conn.run_sync(Base.metadata.drop_all)\n```\n\nThe four Alembic migration files exist:\n- `55f7c14b391d_create_users_and_password_reset_tokens.py`\n- `a1b2c3d4e5f6_add_fk_password_reset_token_user_id.py`\n- `12fa982ac6c3_add_license_cache_and_script_.py`\n- `a2b3c4d5e6f7_phase9_rbac_chat.py`\n\nNone of these are executed by any test. If a developer introduces a migration with incorrect `render_as_batch=True` usage for SQLite's `ALTER TABLE` limitations, the migration will fail silently in CI because `create_all` bypasses it. The only time the migration runs is on `docker compose up` or manual `alembic upgrade head`.",
      "Why It Was Done This Way (Root Cause)": "Using `create_all` for tests is a common and correct approach for fast iteration — running migrations in an in-memory SQLite test DB is slower and more complex to set up (requires a file-based SQLite or a separate test DB). The Phase 6 test harness prioritized speed and simplicity. Adding a migration smoke test was deferred as an infrastructure task.",
      "What Is Done Right": "The `create_all` approach correctly creates all tables with the right schema as defined by the ORM models. Since the ORM models and the Alembic migrations are kept in sync (each phase adds both a migration and an ORM update), the test DB schema matches production. The startup event at `rawapi.py:196-206` does run `alembic upgrade head` on real deployments, providing a manual verification point.",
      "How To Fix It": "**Step 1 — Add a separate conftest fixture that runs Alembic migrations on a file-based SQLite DB.**\n\nCreate `src/backend/tests/test_migrations.py`:\n\n```python\n\"\"\"\nMigration smoke test: runs all Alembic migrations from scratch on a temp DB.\nVerifies that alembic upgrade head completes without error.\nSeparate from conftest.py — uses a file-based SQLite (Alembic cannot run on in-memory DBs\nbecause it uses subprocess/separate connections).\n\"\"\"\nimport os\nimport subprocess\nimport tempfile\nimport pytest\n\n\n@pytest.mark.migrations\ndef test_alembic_upgrade_head_completes():\n    \"\"\"\n    Run `alembic upgrade head` against a fresh file-based SQLite DB.\n    Fails if any migration script has a syntax error, wrong batch_alter context,\n    or broken op.add_column call.\n    \"\"\"\n    with tempfile.TemporaryDirectory() as tmpdir:\n        db_path = os.path.join(tmpdir, \"test_migrations.db\")\n        backend_dir = os.path.join(os.path.dirname(__file__), \"..\")\n\n        env = {\n            **os.environ,\n            \"DATABASE_URL\": f\"sqlite+aiosqlite:///{db_path}\",\n            \"JWT_SECRET_KEY\": \"test-migration-key-32chars!!!!!!\",\n        }\n\n        result = subprocess.run(\n            [\"alembic\", \"upgrade\", \"head\"],\n            cwd=backend_dir,\n            capture_output=True,\n            text=True,\n            env=env,\n            timeout=60,\n        )\n\n        assert result.returncode == 0, (\n            f\"alembic upgrade head failed:\\n\"\n            f\"STDOUT: {result.stdout}\\n\"\n            f\"STDERR: {result.stderr}\"\n        )\n        assert \"ERROR\" not in result.stderr, (\n            f\"Alembic reported errors:\\n{result.stderr}\"\n        )\n\n\n@pytest.mark.migrations\ndef test_alembic_downgrade_base_completes():\n    \"\"\"\n    Run `alembic downgrade base` after `upgrade head` to verify downgrade path.\n    Optional: marks migration as reversible.\n    \"\"\"\n    with tempfile.TemporaryDirectory() as tmpdir:\n        db_path = os.path.join(tmpdir, \"test_downgrade.db\")\n        backend_dir = os.path.join(os.path.dirname(__file__), \"..\")\n\n        env = {\n            **os.environ,\n            \"DATABASE_URL\": f\"sqlite+aiosqlite:///{db_path}\",\n            \"JWT_SECRET_KEY\": \"test-migration-key-32chars!!!!!!\",\n        }\n\n        up = subprocess.run(\n            [\"alembic\", \"upgrade\", \"head\"],\n            cwd=backend_dir, capture_output=True, text=True, env=env, timeout=60,\n        )\n        assert up.returncode == 0, f\"upgrade failed: {up.stderr}\"\n\n        down = subprocess.run(\n            [\"alembic\", \"downgrade\", \"base\"],\n            cwd=backend_dir, capture_output=True, text=True, env=env, timeout=60,\n        )\n        assert down.returncode == 0, f\"downgrade failed: {down.stderr}\"\n```\n\n**Step 2 — Add the `migrations` marker to `pytest.ini`:**\n```ini\n[pytest]\nmarkers =\n    migrations: Run Alembic migration smoke tests (slower, requires file-based SQLite)\n```\n\n**Step 3 — Run migrations tests separately in CI:**\n```bash\n# Fast unit tests (skip migrations)\npytest src/backend/tests/ -m \"not migrations\" -v\n\n# Migration smoke test (run in a dedicated CI step)\npytest src/backend/tests/test_migrations.py -m migrations -v\n```",
      "Architecture Mapping": "\n**Layer:** Database (Alembic migrations)\n\n**Flow:**\n\n    [New Alembic migration added by developer]\n                    ↓\n    [pytest run via conftest.py create_all]\n                    ↓ (Alembic NOT invoked)\n    [CI passes — migration script never exercised]\n                    ↓\n    [docker compose up → alembic upgrade head]\n                    ↓\n    [Migration script fails → DB mismatch → API 500s or startup error]\n                    ↑\n             GAP LIVES HERE — no CI gate on migration scripts\n\n**Upstream:** Phase execution that adds new ORM models + Alembic migration files\n**Downstream:** `rawapi.py:196-206` startup event, production `docker compose up`",
      "Verification": "- [ ] Grep proof: `grep -rn \"alembic\\|upgrade\" src/backend/tests/` — confirms no migration tests exist\n- [ ] Test proof: After adding `test_migrations.py`: `pytest src/backend/tests/test_migrations.py -v` — should pass\n- [ ] Runtime proof: `cd src/backend && alembic upgrade head` on a fresh DB — confirms migrations run without error",

      "How To Fix It": "**Option A (recommended) — Split into two endpoints:**\n\n**Public endpoint** (no auth, minimal data):\n```python\n@router.get(\"/check\")\nasync def get_license_check(db: AsyncSession = Depends(get_db)):\n    \"\"\"Public endpoint: returns only whether the license is valid, for pre-login screen.\"\"\"\n    result = await validate_license(db)\n    return {\n        \"valid\": result[\"valid\"],\n        \"sales_email\": SALES_EMAIL,\n    }\n```\n\n**Authenticated endpoint** (full details):\n```python\n@router.get(\"/status\")\nasync def get_license_status(\n    db: AsyncSession = Depends(get_db),\n    user_id: int = Depends(get_current_user_id),\n):\n    \"\"\"Authenticated: returns full license details for admin dashboard.\"\"\"\n    result = await validate_license(db)\n    result[\"sales_email\"] = SALES_EMAIL\n    return result\n```\n\n**Option B (simpler) — Add optional auth to the existing endpoint:**\n\nUse `HTTPBearer(auto_error=False)` and return minimal data when unauthenticated, full data when authenticated.\n\n**Step 1 — Update `src/backend/routers/license.py:156`** with Option A above.\n**Step 2 — Update the frontend** to call `/api/license/check` before login and `/api/license/status` (with auth) in the admin dashboard.",

      "Why This Case Was Created": "Hardcoded domain audit for the license validation URL. `LICENSE_SERVER_URL` has a hardcoded fallback to `https://license.arthaBuild.com` — a domain controlled by TechCloudPro. In a BYOC deployment where the operator forgets to set this environment variable, license validation silently contacts `https://license.arthaBuild.com`. If that domain does not exist or the operator intends to run a self-hosted license server, validation will fail every time and the system will enter grace period, then restricted mode — all silently, with no startup error indicating the misconfiguration.",

      "Why It Was Done This Way (Root Cause)": "`https://license.arthaBuild.com` is the planned production license validation server for TechCloudPro's managed ArthaBuild offering. For TechCloudPro's own deployment, this default is correct. The BYOC scenario was not the primary design target when the default was chosen.",
      "What Is Done Right": "The env var pattern is correct — any operator can override `LICENSE_SERVER_URL`. The `LICENSE_KEY` check at `license.py:71-72` correctly skips license server calls when `LICENSE_KEY` is not set (dev mode), so a developer without a license key is unaffected. The grace period and cache logic provide resilience when the server is temporarily unreachable.",
      "How To Fix It": "**Step 1 — Remove the hardcoded default and require explicit configuration when `LICENSE_KEY` is set.**\n\nIn `src/backend/routers/license.py:25`, change:\n```python\nLICENSE_SERVER_URL = os.getenv(\"LICENSE_SERVER_URL\", \"https://license.arthaBuild.com\")\n```\nto:\n```python\nLICENSE_SERVER_URL = os.getenv(\"LICENSE_SERVER_URL\", \"\")\n```\n\n**Step 2 — Add a guard in `validate_license()` when a LICENSE_KEY is set but LICENSE_SERVER_URL is not:**\n\n```python\nasync def validate_license(db: AsyncSession) -> dict:\n    if not LICENSE_KEY:\n        return {\"valid\": True, \"plan\": MODE_DEV, \"mode\": MODE_DEV, \"reason\": \"no LICENSE_KEY set\"}\n\n    if not LICENSE_SERVER_URL:\n        logger.error(\n            \"LICENSE_KEY is set but LICENSE_SERVER_URL is not configured. \"\n            \"Set LICENSE_SERVER_URL=https://your-license-server.com in .env\"\n        )\n        return {\n            \"valid\": False, \"plan\": None, \"mode\": MODE_RESTRICTED,\n            \"reason\": \"LICENSE_SERVER_URL not configured\"\n        }\n    # ... rest of function\n```\n\n**Step 3 — Document in `.env.example`:**\n```\n# Required when LICENSE_KEY is set — URL of the license validation server\nLICENSE_SERVER_URL=https://license.arthaBuild.com\n```\n\nFor TechCloudPro's managed deployment, the default can be documented but not baked in as a code fallback.",

      "Why This Case Was Created": "Configuration hardcode audit for the license grace period. The 72-hour grace period is the window during which the system continues to function when the license server is unreachable (air-gapped deployments, network outages, license server maintenance). This value is a business and operational policy decision — different enterprise customers may require different values (stricter SLAs wanting 24 hours, or more tolerant deployments wanting 168 hours for a week of offline operation). Hardcoding it as an integer literal prevents per-deployment configuration without a code change.",
      "What Is Wrong": "`src/backend/routers/license.py:29`:\n```python\nGRACE_PERIOD_HOURS = 72\n```\n\nThis integer literal is used in `validate_license()` at `license.py:121-125`:\n```python\nif cached and cached.last_checked:\n    hours_elapsed = (now - cached.last_checked).total_seconds() / 3600\n    if hours_elapsed < GRACE_PERIOD_HOURS:\n        return {\n            \"valid\": True, \"plan\": cached.plan, \"mode\": MODE_GRACE,\n            \"hours_remaining\": round(GRACE_PERIOD_HOURS - hours_elapsed, 1),\n            \"source\": \"grace_period\"\n        }\n```\n\nThe `GRACE_PERIOD_HOURS` variable is not read from any environment variable. It is a module-level constant set to `72` with no path for deployment-time configuration. An enterprise customer requiring a 24-hour strict grace period (for security compliance) or a 168-hour period (for weekly offline batch operations) cannot adjust this without modifying and redeploying the source code.",
      "Why It Was Done This Way (Root Cause)": "72 hours was chosen as a reasonable default for the initial implementation. The variable name `GRACE_PERIOD_HOURS` suggests it was intended to be configurable, but the assignment `= 72` reads from a literal rather than from `os.getenv()`. The Phase 7 developer likely intended to add env var support but wrote the literal for the initial implementation and it was not caught in review.",
      "What Is Done Right": "The variable is correctly named (`GRACE_PERIOD_HOURS`), correctly typed (integer), and used in the right place (the grace period check in `validate_license()`). The `hours_remaining` calculation in the response correctly computes fractional hours remaining. The grace period logic itself (using `last_checked` timestamp to compute elapsed time) is architecturally sound.",
      "How To Fix It": "**Step 1 — Change `src/backend/routers/license.py:29`** to read from environment:\n\n```python\nGRACE_PERIOD_HOURS = int(os.getenv(\"GRACE_PERIOD_HOURS\", \"72\"))\n```\n\nThis is a one-line change. The default of `72` is preserved for all existing deployments that do not set the env var.\n\n**Step 2 — Add validation for sensible bounds** (optional but recommended):\n\n```python\nGRACE_PERIOD_HOURS = int(os.getenv(\"GRACE_PERIOD_HOURS\", \"72\"))\nif GRACE_PERIOD_HOURS < 1 or GRACE_PERIOD_HOURS > 720:  # max 30 days\n    logger.warning(\n        f\"GRACE_PERIOD_HOURS={GRACE_PERIOD_HOURS} is outside recommended range [1, 720]. \"\n        \"Using default of 72.\"\n    )\n    GRACE_PERIOD_HOURS = 72\n```\n\n**Step 3 — Document in `.env.example`:**\n```\n# Hours the system operates without license server contact before entering restricted mode (default: 72)\n# GRACE_PERIOD_HOURS=72\n```",
      "Architecture Mapping": "\n**Layer:** Backend Router (license.py — validate_license function)\n\n**Flow:**\n\n    [License server unreachable (network error)]\n               ↓\n    [validate_license() catches Exception]\n               ↓\n    [Check cached.last_checked vs now]\n               ↓\n    [hours_elapsed < GRACE_PERIOD_HOURS (72)]  ← HARDCODED HERE\n               ↓ if true\n    [Return mode=\"grace\", hours_remaining=N]\n               ↓ if false\n    [Return mode=\"restricted\", valid=False]\n\n**Upstream:** `validate_license()` called from startup check and per-request chatbot license guard\n**Downstream:** Grace period response returned to chatbot endpoint, `hours_remaining` displayed to admin UI",
      "Verification": "- [ ] Grep proof: `grep -n \"GRACE_PERIOD_HOURS\\|= 72\" src/backend/routers/license.py`\n- [ ] Test proof: No existing test parameterizes the grace period — gap. After fix, test with `os.environ[\"GRACE_PERIOD_HOURS\"] = \"1\"` to verify short grace period is respected.\n- [ ] Runtime proof: Set `GRACE_PERIOD_HOURS=1` in `.env`, restart server, then simulate license server outage — system should enter restricted mode after 1 hour instead of 72",

    "id": "CASE-035",

    "phase": "07",

    "severity": "LOW",
    "status": "OPEN",

    "sections": {
      "Why This Case Was Created": "Configuration hardcode audit for the license validation cache TTL. The 7-day cache TTL determines how often the system contacts the license server. When the cache is valid, the server never calls `https://license.arthaBuild.com` — it returns the cached result. If a license is revoked mid-term (e.g., payment failure), the system will continue running for up to 7 days before detecting the revocation. For stricter enforcement deployments, a shorter TTL (e.g., 1 day) is needed. For air-gapped deployments, a longer TTL (e.g., 30 days) is needed. Hardcoding 7 days prevents per-deployment tuning.",
      "What Is Wrong": "`src/backend/routers/license.py:28`:\n```python\nCACHE_TTL_DAYS = 7\n```\n\nThis integer literal is used in `validate_license()` at `license.py:99-107`:\n```python\nif data.get(\"valid\"):\n    plan = data.get(\"plan\", \"starter\")\n    if cached:\n        cached.valid_until = now + timedelta(days=CACHE_TTL_DAYS)   # ← hardcoded\n        cached.last_checked = now\n        cached.plan = plan\n    else:\n        db.add(LicenseCache(\n            license_key=LICENSE_KEY, instance_id=instance_id,\n            plan=plan, valid_until=now + timedelta(days=CACHE_TTL_DAYS),   # ← hardcoded\n            last_checked=now,\n        ))\n```\n\nAnd the cache validity check at `license.py:87`:\n```python\nif cached and cached.valid_until and cached.valid_until > now:\n    return {\"valid\": True, \"plan\": cached.plan, \"mode\": MODE_ACTIVE, ...}\n```\n\nThe `valid_until` stored in the DB is set to `now + timedelta(days=7)`. A revoked license is not detected for up to 7 days. The gap between the `GRACE_PERIOD_HOURS` (72h) and the `CACHE_TTL_DAYS` (168h) means a deployment with a revoked license continues in MODE_ACTIVE for the full 7-day cache window — the grace period never even activates because the cache appears valid.",

    "phase": "07.1",

    "assignee": "Priya",
    "blocks": [],
    "blocked_by": [],
    "files": [
      {
        "path": "src/backend/routers/netsuite.py",

      },
      {
        "path": "src/backend/routers/netsuite.py",
        "lines": "224-232"
