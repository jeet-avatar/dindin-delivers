    "sections": {
      "Why This Case Was Created": "Phase correctness audit for the NetSuite auto-indexing feature. After a user successfully authenticates their TBA credentials, the `/api/netsuite/authenticate` endpoint fires a background task `_index_customer_netsuite(body.account_id, credentials_dict)`. The `credentials_dict` is built at `netsuite.py:225-230` with specific key names. Inside `_index_customer_netsuite()`, those same keys are consumed using `credentials.get(\"token_key\")` etc. Cross-checking the key names between the dict construction site and the consumption site reveals a potential mismatch. Additionally, the function's silent exception handling (`except Exception: logger.warning(...)`) means any key mismatch causes the entire indexing task to silently fail — the user receives a successful TBA connection response but their scripts are never indexed for RAG.",
      "What Is Wrong": "**Dict construction at `netsuite.py:225-230`:**\n```python\ncredentials_dict = {\n    \"token_key\": body.token_key,\n    \"token_secret\": body.token_secret,\n    \"consumer_key\": body.consumer_key,\n    \"consumer_secret\": body.consumer_secret,\n}\nasyncio.create_task(_index_customer_netsuite(body.account_id, credentials_dict))\n```\n\n**Dict consumption inside `_index_customer_netsuite` at `netsuite.py:127-133`:**\n```python\nauth_config = {\n    \"defaultAuthId\": \"index_session\",\n    \"accounts\": {\n        \"index_session\": {\n            \"accountId\": account_id,\n            \"tokenId\": credentials.get(\"token_key\"),         # key: \"token_key\" ✓\n            \"tokenSecret\": credentials.get(\"token_secret\"),  # key: \"token_secret\" ✓\n            \"consumerKey\": credentials.get(\"consumer_key\"),  # key: \"consumer_key\" ✓\n            \"consumerSecret\": credentials.get(\"consumer_secret\"),  # key: \"consumer_secret\" ✓\n        }\n    },\n}\n```\n\n**The key names match in this case.** However, the deeper issue is that `_index_customer_netsuite` does not validate that the credentials dict contains the expected keys before using them. If a refactor of the `authenticate` endpoint changes the dict key names (e.g., to camelCase for consistency), `credentials.get(\"token_key\")` would return `None`, building a `None`-valued auth config that `suitecloud` CLI would reject — and the failure at `netsuite.py:148-150` would log a warning and return silently without notifying the user.\n\nAdditionally, the `langchain_community` and `langchain_ollama` imports inside the async function at `netsuite.py:156-159` are inside a try block that catches `Exception`. An `ImportError` (Langchain not installed) silently absorbs the failure and the function returns without indexing — no error propagated.\n\n**Specific silent-failure path:**\n```python\ntry:\n    ...\n    from langchain_community.vectorstores import FAISS   # ImportError if not installed\n    ...\nexcept Exception as e:\n    logger.warning(f\"NetSuite auto-index failed (non-fatal): {e}\")\n    # Returns None — caller (asyncio.create_task) never sees this\n```",
      "Why It Was Done This Way (Root Cause)": "The auto-indexing feature is explicitly designed as non-fatal — the TBA connection success should not be blocked by indexing failures. The broad `except Exception` was intentional. The credentials dict key names were chosen to match Python naming conventions (snake_case) while the `auth_config` JSON uses the SuiteCloud CLI's camelCase convention — the `credentials.get()` calls translate between them at `netsuite.py:127-133`.",
      "What Is Done Right": "The TBA authentication flow itself is completely isolated from the indexing task (`asyncio.create_task` fire-and-forget). The user's `authenticate` response is never delayed by indexing. The credentials dict key names currently match the consumption code. The `customer_index_dir` is correctly separated from the global FAISS index, preventing cross-customer data leakage.",
      "How To Fix It": "**Step 1 — Add explicit key validation at the top of `_index_customer_netsuite` (`netsuite.py:116`):**\n\n```python\nasync def _index_customer_netsuite(account_id: str, credentials: dict):\n    required_keys = {\"token_key\", \"token_secret\", \"consumer_key\", \"consumer_secret\"}\n    missing = required_keys - set(credentials.keys())\n    if missing:\n        logger.error(\n            f\"_index_customer_netsuite: credentials dict missing keys {missing}. \"\n            \"Indexing aborted. Check credentials_dict construction in authenticate().\"\n        )\n        return\n    try:\n        ...\n```\n\n**Step 2 — Log a structured summary on success/failure at the end of the function:**\n\n```python\n    if docs:\n        ...\n        logger.info(f\"Customer index saved: {len(chunks)} chunks from {len(docs)} scripts\")\n    else:\n        logger.info(f\"No scripts found to index for account {account_id}\")\nexcept Exception as e:\n    logger.warning(f\"NetSuite auto-index failed (non-fatal): {e}\", exc_info=True)  # add exc_info for full traceback\n```\n\n**Step 3 — Expose indexing status in the authenticate response (optional, informational):**\n\n```python\nreturn AuthenticateResponse(\n    authenticated=True,\n    account_name=account_name,\n    message=f\"Connected to NetSuite account {account_name}. Background indexing started.\",\n)\n```\n\n**Step 4 — Add a test that verifies credentials dict key names match expected consumption:**\n\n```python\n# test_netsuite.py\ndef test_credentials_dict_keys_match_index_function():\n    \"\"\"Verify that credentials_dict keys built in authenticate() match what _index_customer_netsuite() reads.\"\"\"\n    from routers.netsuite import _index_customer_netsuite\n    # The function reads: token_key, token_secret, consumer_key, consumer_secret\n    expected_keys = {\"token_key\", \"token_secret\", \"consumer_key\", \"consumer_secret\"}\n    credentials_dict = {\n        \"token_key\": \"test_token_key\",\n        \"token_secret\": \"test_token_secret\",\n        \"consumer_key\": \"test_consumer_key\",\n        \"consumer_secret\": \"test_consumer_secret\",\n    }\n    assert set(credentials_dict.keys()) == expected_keys, (\n        \"credentials_dict keys do not match what _index_customer_netsuite() reads via .get()\"\n    )\n```",
      "Architecture Mapping": "\n**Layer:** Backend Router (netsuite.py — background task)\n\n**Flow:**\n\n    [POST /api/netsuite/authenticate]\n               ↓\n    [_validate_tba_credentials() → success]\n               ↓\n    [credentials_dict = {token_key, token_secret, consumer_key, consumer_secret}]\n               ↓\n    [asyncio.create_task(_index_customer_netsuite(account_id, credentials_dict))]\n               ↓ (background, non-blocking)\n    [Response: {authenticated: true} returned to user immediately]\n\n    [Background: _index_customer_netsuite running]\n               ↓\n    [credentials.get(\"token_key\")  ← relies on key name contract]\n               ↓ if key missing: None → SuiteCloud auth fails → warning log → silent return\n               ↓ if ImportError:    → except Exception → warning log → silent return\n\n**Upstream:** `POST /api/netsuite/authenticate` (netsuite.py:188) — triggers the background task\n**Downstream:** FAISS customer index at `./data/customer_index`, RAG pipeline that reads this index",
      "Verification": "- [ ] Grep proof: `grep -n \"credentials.get\\|credentials_dict\" src/backend/routers/netsuite.py`\n- [ ] Test proof: `pytest src/backend/tests/test_netsuite.py -v` — currently no test for background indexing behavior\n- [ ] Runtime proof: Add `print(credentials)` at the start of `_index_customer_netsuite`, authenticate via API, observe the credentials dict in logs to confirm all 4 keys are present",
      "Downstream Impact": "**Impact if unfixed:** Degraded UX (silent feature failure)\n\nThe auto-indexing feature is a personalization feature — without it, the RAG pipeline answers from the global SuiteScript knowledge base only, not from the customer's actual scripts. If indexing silently fails, the customer never knows their personalized RAG is unavailable. Questions about their specific scripts return generic answers. No data loss, no security risk.",

         \"email\": email_b, \"password\": \"MemberB1!\",\n        })\n\n        # Assign teams and roles directly in DB\n        result_a = await db_session.execute(select(User).where(User.email == email_a))\n        admin_a = result_a.scalar_one_or_none()\n        result_b = await db_session.execute(select(User).where(User.email == email_b))\n        member_b = result_b.scalar_one_or_none()\n\n        if admin_a is None or member_b is None:\n            pytest.skip(\"Could not create test users\")\n\n        admin_a.role = \"admin\"\n        admin_a.team_id = team_a.id\n        member_b.team_id = team_b.id\n        await db_session.commit()\n\n        # Admin A logs in\n        login_resp = await client.post(\"/api/auth/login\", json={\"username\": email_a, \"password\": \"AdminA1!\"})\n        assert login_resp.status_code == 200\n        token_a = login_resp.json()[\"access_token\"]\n\n        # Admin A fetches team members\n        resp = await client.get(\"/api/admin/team\", headers={\"Authorization\": f\"Bearer {token_a}\"})\n        assert resp.status_code == 200\n        members = resp.json()\n        member_emails = [m[\"email\"] for m in members]\n\n        assert email_b not in member_emails, (\n            f\"Admin A should not see Team B member. Got: {member_emails}\"\n        )\n```\n\n**Run:**\n```bash\npytest src/backend/tests/test_team_isolation.py::TestCrossTeamIsolation::test_admin_team_a_cannot_see_team_b_members -v\n```",

      "Why It Was Done This Way (Root Cause)": "The Phase 9 test for admin removal (`test_admin_remove_member_endpoint_exists`) was written to verify the primary use case (successful removal). Testing the self-removal guard requires knowing the admin's own user ID, which is available in the JWT payload but requires an extra DB lookup or response field to extract in the test context. This added complexity was not addressed during the initial test authorship.",
      "What Is Done Right": "The backend guard at `admin.py:157-158` is correctly placed — it executes after verifying the target user exists and is on the admin's team (`admin.py:154-156`), so the self-removal check happens in the right order. The check uses `user.id == admin.id` (integer comparison), not email comparison, which is the correct identity check. The frontend guard provides an additional UX safeguard.",

stAdminChats::test_admin_cannot_remove_themselves -v\n```",

      "Why This Case Was Created": "Monetization gate coverage audit. The license system enforces a deploy quota per tier: 10 deploys for `starter`, 100 for `growth`, unlimited for `enterprise` (`license.py:37-41`). The `check_deploy_quota()` function at `license.py:131-144` returns `{allowed, used, limit}`. When the quota is exceeded, the deploy endpoint is expected to return 402 Payment Required. This is a critical monetization gate — it is the mechanism that converts free/starter users into paid customers. No test verifies the 402 response when the quota is exhausted. If the quota check is accidentally bypassed in a future refactor, the monetization gate silently fails open.",
      "What Is Wrong": "`src/backend/routers/license.py:131-144`:\n```python\nasync def check_deploy_quota(db: AsyncSession, user_id: int, plan: str) -> dict:\n    \"\"\"Check if user can deploy another production script. Returns {allowed, used, limit}.\"\"\"\n    limit = TIER_LIMITS.get(plan)\n    if limit is None:\n        return {\"allowed\": True, \"used\": None, \"limit\": None}  # enterprise = unlimited\n\n    result = await db.execute(\n        select(sqlfunc.count(ScriptDeployment.id))\n        .where(ScriptDeployment.user_id == user_id)\n        .where(ScriptDeployment.target == \"production\")\n        .where(ScriptDeployment.license_key == LICENSE_KEY)\n    )\n    used = result.scalar() or 0\n    return {\"allowed\": used < limit, \"used\": used, \"limit\": limit}\n```\n\nThe function is correct, but searching the test suite for quota-related tests:\n- `test_auth.py`: no quota tests\n- `test_chats.py`: no quota tests\n- `test_health.py`: no quota tests\n- `test_netsuite.py`: no quota tests\n- `test_rbac.py`: no quota tests\n- `test_security.py`: no quota tests\n- `test_user.py`: no quota tests\n\nNo test exists that:\n1. Sets a user's deploy count to the quota limit (e.g., 10 for `starter`)\n2. Calls the deploy endpoint\n3. Asserts the response is 402",

      "How To Fix It": "Add a new test file `src/backend/tests/test_quota.py`:\n\n```python\n\"\"\"\nDeploy quota enforcement tests.\nTests that the 402 gate fires correctly when deploy quota is exhausted.\n\"\"\"\nimport pytest\nimport pytest_asyncio\nfrom sqlalchemy import select\nfrom models import User, ScriptDeployment\n\n\nasync def _register_and_login(client, email: str, password: str = \"Quota1!\"):\n    await client.post(\"/api/user/register\", json={\n        \"first_name\": \"Quota\", \"last_name\": \"Test\",\n        \"email\": email, \"password\": password,\n    })\n    resp = await client.post(\"/api/auth/login\", json={\"username\": email, \"password\": password})\n    assert resp.status_code == 200\n    return resp.json()[\"access_token\"]\n\n\n@pytest.mark.asyncio\nclass TestDeployQuota:\n\n    async def test_check_deploy_quota_allowed_when_under_limit(self, db_session):\n        \"\"\"check_deploy_quota returns allowed=True when deployments < limit.\"\"\"\n        from routers.license import check_deploy_quota, TIER_LIMITS\n        # Starter limit is 10, fresh user has 0 deployments\n        quota = await check_deploy_quota(db_session, user_id=99999, plan=\"starter\")\n        assert quota[\"allowed\"] is True\n        assert quota[\"limit\"] == TIER_LIMITS[\"starter\"]\n\n    async def test_check_deploy_quota_blocked_when_at_limit(self, db_session):\n        \"\"\"check_deploy_quota returns allowed=False when deployments == limit.\"\"\"\n        from routers.license import check_deploy_quota, LICENSE_KEY\n        from models import ScriptDeployment\n\n        # Insert 10 ScriptDeployment records for a fake user_id\n        test_user_id = 88888\n        for i in range(10):\n            db_session.add(ScriptDeployment(\n                user_id=test_user_id,\n                script_name=f\"test_script_{i}.js\",\n                target=\"production\",\n                license_key=LICENSE_KEY or \"test-key\",\n            ))\n        await db_session.commit()\n\n        quota = await check_deploy_quota(db_session, user_id=test_user_id, plan=\"starter\")\n        assert quota[\"allowed\"] is False, (\n            f\"Quota should be exhausted after 10 deploys. Got: {quota}\"\n        )\n        assert quota[\"used\"] == 10\n        assert quota[\"limit\"] == 10\n\n    async def test_enterprise_plan_has_no_quota(self, db_session):\n        \"\"\"enterprise plan returns allowed=True regardless of deploy count.\"\"\"\n        from routers.license import check_deploy_quota\n\n        quota = await check_deploy_quota(db_session, user_id=77777, plan=\"enterprise\")\n        assert quota[\"allowed\"] is True\n        assert quota[\"limit\"] is None  # unlimited\n\n    async def test_deploy_endpoint_returns_402_when_quota_exhausted(self, client, db_session):\n        \"\"\"\n        POST /api/deploy/suitescript should return 402 when the user's deploy quota is exhausted.\n        This is the critical monetization gate.\n        \"\"\"\n        from unittest.mock import patch, AsyncMock\n        from routers.license import TIER_LIMITS, LICENSE_KEY\n\n        # Register a user who will hit the quota\n        email = \"quota-user@arthaBuild-test.com\"\n        token = await _register_and_login(client, email)\n\n        result = await db_session.execute(select(User).where(User.email == email))\n        user = result.scalar_one_or_none()\n        if user is None:\n            pytest.skip(\"Could not create quota test user\")\n\n        # Insert 10 records to exhaust starter quota\n        for i in range(10):\n            db_session.add(ScriptDeployment(\n                user_id=user.id,\n                script_name=f\"script_{i}.js\",\n                target=\"production\",\n                license_key=LICENSE_KEY or \"test-key\",\n            ))\n        await db_session.commit()\n\n        # Mock validate_license to return starter plan\n        mock_license = {\"valid\": True, \"plan\": \"starter\", \"mode\": \"active\"}\n\n        with patch(\"routers.deploy.validate_license\", new=AsyncMock(return_value=mock_license)):\n            resp = await client.post(\n                \"/api/deploy/suitescript\",\n                json={\"script_name\": \"test.js\", \"target\": \"production\"},\n                headers={\"Authorization\": f\"Bearer {token}\"},\n            )\n            assert resp.status_code == 402, (\n                f\"Expected 402 when quota exhausted, got {resp.status_code}: {resp.text}\"\n            )\n```\n\n**Run:**\n```bash\npytest src/backend/tests/test_quota.py -v\n```",

    "sections": {
      "Why This Case Was Created": "Defense-in-depth audit for the team member list endpoint. The `GET /api/admin/team` endpoint relies on a single ORM query filter (`where(User.team_id == admin.team_id)`) to restrict results to the admin's team. There is no explicit ownership assertion — no `assert member.team_id == admin.team_id` check on each returned member. If the ORM query were accidentally modified (e.g., the `where` clause removed, or a join introduced that returns cross-team data), the endpoint would silently return incorrect data. The function's correctness depends entirely on one ORM filter being present and unmodified.",
      "What Is Wrong": "`src/backend/routers/admin.py:86-99`:\n```python\nresult = await db.execute(\n    select(User).where(User.team_id == admin.team_id)   # ← entire isolation depends on this\n)\nmembers = result.scalars().all()\nreturn [\n    {\n        \"id\": u.id,\n        \"name\": u.name,\n        \"email\": u.email,\n        \"role\": u.role,\n        \"created_at\": u.created_at.isoformat() if u.created_at else None,\n    }\n    for u in members\n    # ← no assert u.team_id == admin.team_id here\n]\n```\n\nThe return path iterates `members` and serializes each user without verifying that `u.team_id == admin.team_id`. If the ORM query had an accidental SQLAlchemy join that introduces rows from other teams (e.g., a future addition of an outer join for user profile data), those rows would silently appear in the response.\n\nSimilarly, the `GET /api/admin/chats` endpoint at `admin.py:38-64` fetches `team_user_ids` from one query and then fetches `ChatSession` records using `ChatSession.user_id.in_(team_user_ids)`. If the first query returns incorrect user IDs, the second query's `in_()` will return the wrong sessions.\n\nThis is a defense-in-depth gap, not an active bug: the current code is correct. The concern is that the isolation is single-layer with no assertion.",

// PENDING is the first column; PASS is after VERIFIED.
// FAIL cases render in OPEN column (with a red border class).
const COLUMNS = ['PENDING', 'OPEN', 'IN_PROGRESS', 'FIXED', 'VERIFIED', 'PASS', 'DONE', 'DEFERRED'];

const SEV_COLOR = {
  CRITICAL: '#dc2626', HIGH: '#ea580c', MEDIUM: '#d97706', LOW: '#2563eb', INFO: '#6b7280'
};
const CAT_COLOR = {
  HARDCODED: '#f59e0b', DEAD_CODE: '#8b5cf6', API_CORRECTNESS: '#06b6d4',
  TEST_GAP: '#10b981', ARCH_VIOLATION: '#ef4444', PHASE_CORRECTNESS: '#f97316',
  FEATURE_TEST: '#22c55e'
};

// Maps status → which kanban column it appears in
function columnForStatus(status) {
  if (status === 'FAIL') return 'OPEN';     // FAIL goes in OPEN column with red border
  if (COLUMNS.includes(status)) return status;
  return 'OPEN'; // fallback
}

let currentView = 'kanban';
let selectedCaseId = null;
let filteredCases = [];

// ─────────────────────────────────────────────
// LOCALSTORAGE HELPERS
// ─────────────────────────────────────────────
function lsGet(caseId, field) {
  return localStorage.getItem(`case_${caseId}_${field}`);
}
function lsSet(caseId, field, value) {
  localStorage.setItem(`case_${caseId}_${field}`, value);
}
function getEffectiveStatus(c) {
  return lsGet(c.id, 'status') || c.status || 'OPEN';
}
function getEffectiveAssignee(c) {
  return lsGet(c.id, 'assignee') || c.assignee || '';
}
function getComments(caseId) {
  try { return JSON.parse(lsGet(caseId, 'comments') || '[]'); } catch { return []; }
}
function saveComments(caseId, arr) {
  lsSet(caseId, 'comments', JSON.stringify(arr));
}

// ─────────────────────────────────────────────
// EFFECTIVE CASE — merge ls overrides
// ─────────────────────────────────────────────
function effectiveCase(c) {
  return { ...c, status: getEffectiveStatus(c), assignee: getEffectiveAssignee(c) };
}

// ─────────────────────────────────────────────
// LOCKED CHECK — blocked by any open case
// ─────────────────────────────────────────────
function isLocked(c) {
  if (!c.blocked_by || c.blocked_by.length === 0) return false;
  return c.blocked_by.some(bid => {
    const blocker = CASES.find(x => x.id === bid);
    if (!blocker) return false;
    const st = getEffectiveStatus(blocker);
    return st === 'OPEN' || st === 'IN_PROGRESS';
  });
}

  const search = document.getElementById('fSearch').value.toLowerCase().trim();
  const phase = document.getElementById('fPhase').value;
  const sev = document.getElementById('fSeverity').value;
  const cat = document.getElementById('fCategory').value;
  const status = document.getElementById('fStatus').value;
  const assignee = document.getElementById('fAssignee').value;

  filteredCases = CASES.map(effectiveCase).filter(c => {
    if (search && !c.id.toLowerCase().includes(search) && !c.title.toLowerCase().includes(search)) return false;
    if (phase && c.phase !== phase) return false;
    if (sev && c.severity !== sev) return false;
    if (cat && c.category !== cat) return false;
    if (status) {
      if (c.status !== status) return false;
    } else {
      // Hide WONT_FIX unless explicitly selected
      if (c.status === 'WONT_FIX') return false;
    }
    if (assignee === '__unassigned__' && c.assignee) return false;
    if (assignee && assignee !== '__unassigned__' && c.assignee !== assignee) return false;
    return true;
  });

  renderBoard();
  if (currentView === 'graph') renderGraph();
}

// ─────────────────────────────────────────────
// RENDER BOARD
// ─────────────────────────────────────────────
function renderBoard() {
  // Stats
  const all = CASES.map(effectiveCase);
  const counts = { OPEN: 0, IN_PROGRESS: 0, FIXED: 0, VERIFIED: 0, WONT_FIX: 0, PASS: 0, PENDING: 0, FAIL: 0 };
  all.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });
  document.getElementById('statsBar').textContent =
    `Total: ${all.length} | Open: ${counts.OPEN} | In Progress: ${counts.IN_PROGRESS} | Fixed: ${counts.FIXED} | Verified: ${counts.VERIFIED} | Won't Fix: ${counts.WONT_FIX} | Pass: ${counts.PASS} | Pending: ${counts.PENDING} | Fail: ${counts.FAIL}`;

  // Render columns
  COLUMNS.forEach(col => {
    const colCases = filteredCases.filter(c => c.status === col);
    document.getElementById(`cnt-${col}`).textContent = colCases.length;
    const container = document.getElementById(`cards-${col}`);
    container.innerHTML = '';
    if (colCases.length === 0) {
      container.innerHTML = '<div class="empty-col">No cases</div>';
    } else {
      colCases.forEach(c => container.appendChild(buildCard(c)));
    }
  });

  // Assignee dropdown
  populateAssigneeFilter();
}

function buildCard(c) {
  const div = document.createElement('div');
  div.className = `case-card cat-${c.category}${selectedCaseId === c.id ? ' selected' : ''}`;
  div.onclick = () => openDetail(c.id);
  const locked = isLocked(c);
  div.innerHTML = `
    <div class="card-id">
      <span>${escHtml(c.id)}</span>
      ${locked ? '<span class="lock-icon" title="Blocked by open dependency">&#128274;</span>' : ''}
    </div>
    <div class="card-title">${escHtml(c.title)}</div>
    <div class="card-badges">
      <span class="badge badge-sev-${c.severity}">${c.severity}</span>
      <span class="badge badge-phase">P${c.phase}</span>
      <span class="badge badge-cat">${c.category.replace(/_/g,' ')}</span>
    </div>`;
  return div;
}

function populateAssigneeFilter() {
  const sel = document.getElementById('fAssignee');
  const cur = sel.value;
  const assignees = [...new Set(CASES.map(effectiveCase).map(c => c.assignee).filter(Boolean))].sort();
  // Keep first two fixed options
  while (sel.options.length > 2) sel.remove(2);
  assignees.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    sel.appendChild(opt);
  });
  sel.value = cur;
}

// ─────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────
function openDetail(caseId) {
  selectedCaseId = caseId;
  const c = effectiveCase(CASES.find(x => x.id === caseId));
  const panel = document.getElementById('detailPanel');
  const inner = document.getElementById('detailInner');
  panel.classList.add('open');

  const comments = getComments(caseId);
  const commentListHtml = comments.length === 0 ? '<div style="color:var(--text-muted);font-size:12px;font-style:italic;">No comments yet.</div>' :
    comments.map(cm => `<div class="comment-item"><div class="comment-ts">${new Date(cm.timestamp).toLocaleString()}</div><div class="comment-text">${escHtml(cm.text)}</div></div>`).join('');

  const filesHtml = (c.files && c.files.length > 0) ? `
    <div class="detail-files">
      <div class="detail-files-title">Files</div>
      ${c.files.map(f => `<div class="file-item">${escHtml(f.path)} ${f.lines ? `<span class="file-lines">:${escHtml(f.lines)}</span>` : ''}</div>`).join('')}
    </div>` : '';

  const blocksHtml = (c.blocks && c.blocks.length > 0) ?
    c.blocks.map(bid => `<span class="dep-link" onclick="openDetail('${escHtml(bid)}')">${escHtml(bid)}</span>`).join(' ') : '<span style="color:var(--text-muted);font-size:11px;">None</span>';
  const blockedByHtml = (c.blocked_by && c.blocked_by.length > 0) ?
    c.blocked_by.map(bid => `<span class="dep-link" onclick="openDetail('${escHtml(bid)}')">${escHtml(bid)}</span>`).join(' ') : '<span style="color:var(--text-muted);font-size:11px;">None</span>';

  const sectionsHtml = c.sections ? Object.entries(c.sections).map(([k, v]) => `
    <div class="section-block">
      <div class="section-title">${escHtml(k)}</div>
      <div class="section-content">${renderMarkdown(v)}</div>
    </div>`).join('') : '';

  inner.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-id">${escHtml(c.id)}</div>
        <div class="detail-title">${escHtml(c.title)}</div>
      </div>
      <button class="detail-close" onclick="closeDetail()" title="Close">&#10005;</button>
    </div>
    <div class="detail-body">
      <div class="detail-meta">
        <div class="meta-field"><span class="meta-label">Phase</span><span class="meta-value">${escHtml(c.phase)} — ${escHtml(c.phase_name || '')}</span></div>
        <div class="meta-field"><span class="meta-label">Severity</span><span class="meta-value"><span class="badge badge-sev-${c.severity}">${c.severity}</span></span></div>
        <div class="meta-field"><span class="meta-label">Category</span><span class="meta-value">${escHtml(c.category.replace(/_/g,' '))}</span></div>
        <div class="meta-field"><span class="meta-label">Created</span><span class="meta-value">${escHtml(c.created || '')}</span></div>
        <div class="meta-field"><span class="meta-label">Updated</span><span class="meta-value">${escHtml(c.updated || '')}</span></div>
        <div class="meta-field">
          <span class="meta-label">Assignee</span>
          <input class="detail-input" id="dpAssignee" type="text" value="${escAttr(c.assignee)}" placeholder="Unassigned"
            onblur="saveAssignee('${escAttr(c.id)}', this.value)">
        </div>
        <div class="meta-field">
          <span class="meta-label">Agent</span>
          <span class="meta-value" style="font-family:monospace;color:var(--accent);font-size:11px;">${escHtml(c.agent || '—')}</span>
        </div>
        <div class="meta-field" style="grid-column:1/-1">
          <span class="meta-label">Status</span>
          <select class="detail-select" id="dpStatus" onchange="saveStatus('${escAttr(c.id)}', this.value)">
            ${['OPEN','IN_PROGRESS','FIXED','VERIFIED','WONT_FIX','PENDING','PASS','FAIL'].map(s => `<option value="${s}"${c.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="dep-row" style="margin-bottom:6px;">
        <span class="dep-label">Blocks:</span> ${blocksHtml}
      </div>
      <div class="dep-row" style="margin-bottom:12px;">
        <span class="dep-label">Blocked by:</span> ${blockedByHtml}
      </div>

      ${filesHtml}

      <button class="btn" style="margin-bottom:12px;" onclick="copyToClipboard('${escAttr(c.id)}')">Copy Case ID</button>

      <hr class="divider">
      <div class="sections-area">${sectionsHtml}</div>

      <hr class="divider">
      <div class="comments-area">
        <div class="comments-title">Comments</div>
        <div class="comment-list" id="commentList-${escAttr(c.id)}">${commentListHtml}</div>
        <div class="comment-add">
          <textarea class="comment-textarea" id="commentInput-${escAttr(c.id)}" placeholder="Add a comment..."></textarea>
          <button class="comment-submit" onclick="addComment('${escAttr(c.id)}')">Add Comment</button>
        </div>
      </div>
    </div>`;

  // Re-render board to show selected state
  renderBoard();
  // Re-attach panel since renderBoard doesn't touch it
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
  selectedCaseId = null;
  document.getElementById('detailPanel').classList.remove('open');
  renderBoard();
}

function saveStatus(caseId, newStatus) {
  lsSet(caseId, 'status', newStatus);
  renderBoard();
  if (currentView === 'graph') renderGraph();
}

function saveAssignee(caseId, val) {
  lsSet(caseId, 'assignee', val.trim());
  renderBoard();
}

function addComment(caseId) {
  const ta = document.getElementById(`commentInput-${caseId}`);
  const text = ta ? ta.value.trim() : '';
  if (!text) return;
  const comments = getComments(caseId);
  comments.push({ text, timestamp: Date.now() });
  saveComments(caseId, comments);
  ta.value = '';
  // Re-open to refresh
  openDetail(caseId);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => showToast(`Copied: ${text}`)).catch(() => showToast('Copy failed'));
}

// ─────────────────────────────────────────────
// MARKDOWN RENDERER (basic)
// ─────────────────────────────────────────────
function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  // Code fences
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Bullet lists — collect consecutive lines starting with - or *
  html = html.replace(/((?:^|\n)[ \t]*[-*] .+)+/g, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[ \t]*[-*] /, '').trim()}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Line breaks
  html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
  return `<p>${html}</p>`;
}

// ─────────────────────────────────────────────
// ESCAPE HELPERS
// ─────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────
// VIEW SWITCHING
// ─────────────────────────────────────────────
function switchView(view) {
  currentView = view;
  const kanban = document.getElementById('kanbanBoard');
  const graph = document.getElementById('graphWrap');
  document.getElementById('btnKanban').classList.toggle('active', view === 'kanban');
  document.getElementById('btnGraph').classList.toggle('active', view === 'graph');
  if (view === 'kanban') {
    kanban.style.display = 'flex';
    graph.classList.remove('active');
  } else {
    kanban.style.display = 'none';
    graph.classList.add('active');
    renderGraph();
  }
}

// ─────────────────────────────────────────────
// DEPENDENCY GRAPH (SVG)
// ─────────────────────────────────────────────
function renderGraph() {
  const svg = document.getElementById('graphSvg');
  svg.innerHTML = '';

  const cases = filteredCases.length > 0 ? filteredCases : CASES.map(effectiveCase);
  if (cases.length === 0) {
    svg.setAttribute('width', 400);
    svg.setAttribute('height', 200);
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', 200); txt.setAttribute('y', 100);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', '#64748b'); txt.setAttribute('font-size', '14');
    txt.textContent = 'No cases to display';
    svg.appendChild(txt);
    return;
  }

  // Group by phase
  const phaseMap = {};
  cases.forEach(c => {
    if (!phaseMap[c.phase]) phaseMap[c.phase] = [];
    phaseMap[c.phase].push(c);
  });
  const phases = Object.keys(phaseMap).sort();

  const nodeR = 28;
  const hGap = 90;
  const vGap = 100;
  const marginX = 60;
  const marginY = 60;

  // Assign positions
  const pos = {};
  phases.forEach((ph, pi) => {
    const row = phaseMap[ph];
    const rowW = row.length * hGap - hGap + nodeR * 2;
    const startX = marginX;
    row.forEach((c, ci) => {
      pos[c.id] = { x: startX + ci * hGap, y: marginY + pi * vGap };
    });
  });

  const totalW = Math.max(...Object.values(pos).map(p => p.x)) + marginX + nodeR + 20;
  const totalH = Math.max(...Object.values(pos).map(p => p.y)) + marginY + nodeR + 20;
  svg.setAttribute('width', Math.max(totalW, 600));
  svg.setAttribute('height', Math.max(totalH, 400));

  // Defs (arrowhead)
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#4b6080"/>
  </marker>`;
  svg.appendChild(defs);

  // Phase labels
  phases.forEach((ph, pi) => {
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', 8);
    txt.setAttribute('y', marginY + pi * vGap + 4);
    txt.setAttribute('fill', '#475569');
    txt.setAttribute('font-size', '11');
    txt.setAttribute('font-family', 'monospace');
    txt.textContent = `P${ph}`;
    svg.appendChild(txt);
  });

  // Edges
  cases.forEach(c => {
    if (!c.blocks) return;
    c.blocks.forEach(tid => {
      if (!pos[c.id] || !pos[tid]) return;
      const from = pos[c.id];
      const to = pos[tid];
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const ex = from.x + dx / dist * nodeR;
      const ey = from.y + dy / dist * nodeR;
      const ex2 = to.x - dx / dist * (nodeR + 8);
      const ey2 = to.y - dy / dist * (nodeR + 8);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', ex); line.setAttribute('y1', ey);
      line.setAttribute('x2', ex2); line.setAttribute('y2', ey2);
      line.setAttribute('stroke', '#4b6080');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('marker-end', 'url(#arrow)');
      svg.appendChild(line);
    });
  });

  // Nodes
  cases.forEach(c => {
    if (!pos[c.id]) return;
    const { x, y } = pos[c.id];
    const locked = isLocked(c);
    const verified = c.status === 'VERIFIED';
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => { if (currentView === 'graph') { switchView('kanban'); openDetail(c.id); } });

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', nodeR);
    circle.setAttribute('fill', SEV_COLOR[c.severity] || '#6b7280');
    circle.setAttribute('fill-opacity', '0.25');
    circle.setAttribute('stroke', locked ? '#ef4444' : verified ? '#10b981' : (CAT_COLOR[c.category] || '#4b6080'));
    circle.setAttribute('stroke-width', '3');
    g.appendChild(circle);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', x); label.setAttribute('y', y - 4);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', '#e2e8f0');
    label.setAttribute('font-size', '10');
    label.setAttribute('font-family', 'monospace');
    label.setAttribute('font-weight', 'bold');
    label.textContent = c.id.length > 8 ? c.id.slice(0,8) : c.id;
    g.appendChild(label);

    const sevTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
    sevTxt.setAttribute('x', x); sevTxt.setAttribute('y', y + 10);
    sevTxt.setAttribute('text-anchor', 'middle');
    sevTxt.setAttribute('fill', SEV_COLOR[c.severity] || '#888');
    sevTxt.setAttribute('font-size', '9');
    sevTxt.textContent = c.severity.slice(0,3);
    g.appendChild(sevTxt);

    if (locked) {
      const lock = document.createElementNS('http://www.w3.org/2000/svg','text');
      lock.setAttribute('x', x + nodeR - 6); lock.setAttribute('y', y - nodeR + 10);
      lock.setAttribute('text-anchor', 'middle');
      lock.setAttribute('fill', '#ef4444');
      lock.setAttribute('font-size', '12');
      lock.textContent = '🔒';
      g.appendChild(lock);
    }

    svg.appendChild(g);
  });
}

// ─────────────────────────────────────────────
// EXPORT CSV
// ─────────────────────────────────────────────
function exportCSV() {
  const cols = ['ID','Title','Phase','Category','Severity','Status','Assignee','Blocks','Blocked By'];
  const rows = [cols.join(',')];
  filteredCases.forEach(c => {
    rows.push([
      csvEsc(c.id),
      csvEsc(c.title),
      csvEsc(c.phase),
      csvEsc(c.category),
      csvEsc(c.severity),
      csvEsc(c.status),
      csvEsc(c.assignee || ''),
      csvEsc((c.blocks || []).join(';')),
      csvEsc((c.blocked_by || []).join(';')),
    ].join(','));
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `arthaBuild-cases-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}
function csvEsc(v) {
  const s = String(v || '');
  return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  applyFilters();
}

init();
